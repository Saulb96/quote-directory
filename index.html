<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1S · Quote Directory</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://alcdn.msauth.net">
<style>
:root{
  --ink:#16202c; --muted:#5f6c7d;
  --glass:rgba(255,255,255,.62); --edge:rgba(255,255,255,.75);
  --shadow:0 8px 32px rgba(31,45,75,.12);
  --accentink:#1b6fae; --sel:#1b6fae; --grid:rgba(95,108,125,.16);
  --good:#2f7d4f; --good-soft:rgba(63,125,88,.15);
  --warn:#9a6b2f; --warn-soft:rgba(154,107,47,.13);
  --bad:#b4452f; --bad-soft:rgba(180,69,47,.12);
  --ring:rgba(47,155,214,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:14px;line-height:1.45;color:var(--ink);
  background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
#flow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex:0 0 auto;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--edge);box-shadow:0 2px 14px rgba(31,45,75,.06);
}
.brand{font-weight:700;font-size:15px}
.brand span{color:var(--muted);font-weight:400;margin-left:9px;font-size:12px}
.spacer{flex:1}
.who{font-size:12.5px;color:var(--muted)}

button{font-family:inherit;cursor:pointer}
.btn{
  font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:11px;
  border:1px solid var(--edge);background:rgba(255,255,255,.75);color:var(--ink);white-space:nowrap;
}
.btn:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{color:#fff;background:linear-gradient(135deg,#2f9bd6,#1b6fae);border:1px solid var(--edge)}
.btn.sm{padding:6px 10px;font-size:11.5px}
.icon{border:none;background:none;padding:3px;border-radius:7px;color:var(--muted);line-height:0}
.icon:hover{background:rgba(255,255,255,.8);color:var(--bad)}

.main{flex:1;overflow:auto;padding:18px 20px 40px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.card{
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);
}
.card-hd{padding:11px 16px;border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:10px}
.card-hd h2{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card-bd{padding:14px 16px}
.card-bd.flush{padding:0}

input,select,textarea{
  font-family:inherit;font-size:13px;color:var(--ink);
  background:rgba(255,255,255,.8);border:1px solid var(--edge);
  border-radius:11px;padding:8px 12px;width:100%;outline:none;
}
input:focus,select:focus,textarea:focus{background:#fff;box-shadow:0 0 0 3px var(--ring)}
label.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
label.fld > span{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.hdr-grid{display:flex;gap:13px;align-items:flex-end;flex-wrap:wrap}
.hdr-grid .nm-f{flex:1 1 320px;max-width:460px}
.hdr-grid .dt-f{flex:0 0 176px}
select.sheet{font-size:16px;font-weight:700;padding:9px 12px}
.clip{
  display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  border:1px solid var(--edge);background:rgba(255,255,255,.75);padding:9px 14px;border-radius:11px;color:var(--ink);
}
.clip:hover{background:#fff}
.files{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.file{
  display:flex;align-items:center;gap:7px;font-size:12.5px;
  background:rgba(255,255,255,.8);border:1px solid var(--edge);
  padding:4px 6px 4px 12px;border-radius:999px;max-width:290px;
}
.file a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file a:hover{text-decoration:underline;color:var(--accentink)}
.file .sz{color:var(--muted);font-size:11px;flex:0 0 auto}

.tbl-scroll{overflow:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:middle}
thead th{
  font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  background:rgba(240,245,251,.97);position:sticky;top:0;z-index:2;white-space:nowrap;
  border-bottom:1px solid var(--grid);
}
tbody tr:hover td{background:rgba(255,255,255,.78)}
tbody tr:last-child td{border-bottom:none}
th.grp{text-align:center;border-left:1px solid var(--grid);color:var(--accentink)}
td.grp-l{border-left:1px solid var(--grid)}
.fac-nm{font-weight:600;white-space:nowrap}
.num input{text-align:right}
td input,td select,td textarea{padding:5px 8px;border-radius:9px;background:rgba(255,255,255,.6);border-color:transparent}
td input:hover,td textarea:hover{border-color:var(--edge);background:rgba(255,255,255,.85)}
td input:focus,td textarea:focus{background:#fff}
td textarea{resize:vertical;min-height:30px;line-height:1.35}
.w-sty{min-width:130px}.w-desc{min-width:190px}.w-cell{min-width:82px}.w-notes{min-width:210px}
.w-mid{min-width:110px}.w-qty{min-width:70px}.w-fnote{min-width:170px}

.step-c{text-align:center;width:136px}
.tick{
  width:21px;height:21px;border-radius:6px;border:1.5px solid rgba(95,108,125,.45);
  background:rgba(255,255,255,.85);display:inline-flex;align-items:center;justify-content:center;
}
.tick:hover:not(:disabled){border-color:var(--accentink);background:#fff;box-shadow:0 0 0 3px var(--ring)}
.tick:disabled{opacity:.3;cursor:default}
.done{
  display:inline-flex;flex-direction:column;align-items:center;
  background:var(--good-soft);color:var(--good);border-radius:9px;padding:3px 10px;
  font-size:11px;font-weight:600;line-height:1.3;position:relative;
}
.done .by{font-weight:400;opacity:.75;font-size:10px}
.done .undo{
  position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:1px solid var(--edge);box-shadow:0 1px 4px rgba(31,45,75,.18);
  color:var(--muted);font-size:10px;display:flex;align-items:center;justify-content:center;
  line-height:1;opacity:0;transition:opacity .13s;
}
tr:hover .done.unlockable .undo{opacity:1}
.done .undo:hover{color:var(--bad)}

.ph{
  width:50px;height:50px;border-radius:9px;overflow:hidden;flex:0 0 auto;
  background:rgba(255,255,255,.55);border:1px solid var(--edge);
  display:flex;align-items:center;justify-content:center;
}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.load{background:linear-gradient(100deg,rgba(255,255,255,.5) 30%,#fff 50%,rgba(255,255,255,.5) 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.ph .none{font-size:9px;color:var(--muted);text-align:center;line-height:1.15;padding:2px}

.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}
.inline-load{display:flex;align-items:center;gap:9px;padding:16px;color:var(--muted);font-size:12.5px}
.spin{width:15px;height:15px;border:2px solid var(--ring);border-top-color:var(--accentink);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.save{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save.err{color:var(--bad);font-weight:600}
.banner{
  display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:14px;
  background:var(--warn-soft);border:1px solid var(--edge);color:var(--warn);font-size:12.5px;
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.row-x{opacity:0;transition:opacity .13s}
tr:hover .row-x{opacity:1}
.add-bar{padding:9px 14px;border-top:1px solid var(--grid);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--muted)}
.hint.warn{color:var(--warn)}
dialog{margin:auto;
  border:1px solid var(--edge);border-radius:18px;padding:0;max-width:440px;width:92vw;
  background:rgba(255,255,255,.92);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);color:var(--ink);
}
dialog::backdrop{background:rgba(22,32,44,.28);backdrop-filter:blur(3px)}
.dlg-bd{padding:18px;display:flex;flex-direction:column;gap:13px}
.dlg-ft{display:flex;justify-content:flex-end;gap:9px}
.gate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%)}
.gate .card{padding:32px 40px;text-align:center;display:flex;flex-direction:column;gap:15px;align-items:center;max-width:440px}
/* ---------- list view ---------- */
.qcard{padding:13px 18px;cursor:pointer;transition:background .13s}
.qcard:hover{background:rgba(255,255,255,.8)}
.q-row{display:flex;align-items:center;gap:16px;min-width:0}
.q-name{font-size:15px;font-weight:700;color:var(--accentink);flex:0 0 auto;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0;flex-wrap:wrap}
.q-meta .sep{color:var(--grid)}
.fu.ok{color:var(--accentink);font-weight:600}
.fu.due{color:#9a6b2f;font-weight:700}
.fu.late{color:var(--bad);font-weight:700}
.pill{font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:999px;white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.b{background:rgba(47,155,214,.16);color:var(--accentink)}
.pill.m{background:rgba(95,108,125,.14);color:var(--muted)}
.backrow{display:flex;align-items:center;gap:12px}
.crumb{font-size:14px}
.crumb b{color:var(--accentink)}
.q-desc{font-size:13.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.month-hd.fold{cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none;font-size:13px;letter-spacing:.06em;color:var(--ink);padding:12px 12px 6px}
.month-hd.fold .car{display:inline-block;color:var(--muted);transition:transform .15s}
.month-hd.fold.open .car{transform:rotate(90deg)}
.month-hd .ct{font-size:11.5px;color:var(--accentink);background:rgba(255,255,255,.8);border:1px solid var(--edge);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.tbl-scroll.vh2{max-height:calc(100vh - 262px)}
th.fz,td.fz{position:sticky;left:0;z-index:3;box-shadow:6px 0 10px -6px rgba(31,45,75,.28)}
th.fz{z-index:7}
td.fz{background:#f6f9fd}
tbody tr:hover td.fz{background:#eef4fb}
th.grp .sub{display:block;font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:2px}
td.fcol{min-width:190px;vertical-align:top}
.fcell{display:flex;flex-direction:column;gap:3px}
.fr{display:flex;align-items:center;gap:5px}
.fr .cur{color:var(--muted);font-size:10.5px;min-width:26px;text-align:right;flex:0 0 auto}
.fr input{padding:3px 7px;font-size:12.5px}
.pencil{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 4px;line-height:1;text-transform:none;letter-spacing:0}
.pencil:hover{color:var(--accentink)}
.err{font-size:11px;color:var(--bad);min-height:14px;margin-top:3px}
.err.good{color:var(--good)}
.fu-rel{font-size:11px;margin-left:6px;white-space:nowrap}
select.btn{appearance:auto;padding-right:8px}
.month-hd{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 6px 0}
td.won{background:var(--good-soft)}
td.won input{font-weight:700;color:var(--good)}
.fu-chip{font-size:14px;font-weight:700;padding:8px 12px;border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.8);color:var(--muted);white-space:nowrap}
.fu-chip.ok{color:var(--accentink)}
.fu-chip.due{color:#9a6b2f}
.fu-chip.late{color:var(--bad)}
/* ---------- segmented pill + search (house) ---------- */
.seg{position:relative;display:flex;border:1px solid var(--edge);border-radius:999px;background:rgba(233,239,247,.85);padding:2px}
.seg button{font-size:11.5px;font-weight:600;padding:6px 13px;border:0;background:none;color:var(--muted);border-radius:999px;white-space:nowrap;transition:color .15s}
.seg button.on{background:#fff;color:var(--accentink);box-shadow:0 1px 4px rgba(31,45,75,.15)}
.seg button:hover:not(.on){color:var(--ink)}
.search{font-size:13px;padding:8px 12px;border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.8);color:var(--ink);width:190px;outline:none}
.search:focus{background:#fff;box-shadow:0 0 0 3px var(--ring)}
/* ---------- photo add / replace ---------- */
.ph{position:relative}
.ph-add{width:100%;height:100%;border:1.5px dashed rgba(95,108,125,.4);border-radius:9px;background:none;color:var(--muted);font-size:17px;font-weight:600}
.ph-add:hover{border-color:var(--accentink);color:var(--accentink);background:rgba(47,155,214,.08)}
.ph-swap{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.9);color:var(--muted);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .13s;padding:0}
.ph:hover .ph-swap{opacity:1}
.ph-swap:hover{color:var(--accentink)}

/* ================= v14 layout ================= */
thead th{text-align:center}
.backlink{align-self:flex-start;font-size:13px;font-weight:600;color:var(--accentink);text-decoration:none;padding:2px 2px 0}
.backlink:hover{text-decoration:underline}
.shead{display:flex;flex-direction:column;gap:10px;padding:2px 4px 4px}
.sh-row{display:flex;align-items:center;gap:10px}
.sh-row.wrap{flex-wrap:wrap}
.sh-name{margin:0;font-size:24px;font-weight:700;color:var(--ink);letter-spacing:.2px}
.sh-name-in{font-size:20px;font-weight:700;text-transform:uppercase;width:220px}
.sh-desc{flex:1 1 320px;max-width:520px;font-size:14px}
.chip{display:flex;flex-direction:column;gap:1px;padding:5px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid var(--edge)}
.chip .k{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip .v{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.chip.ok .v{color:var(--accentink)} .chip.due .v{color:var(--warn)} .chip.late .v{color:var(--bad)}
.pbar-wrap{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:6px;border-radius:999px;background:rgba(95,108,125,.16);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2f9bd6,#1b6fae)}
.pbar-t{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.qcard .pbar-wrap{margin-top:8px}
.bubbles{display:flex;flex-wrap:wrap;gap:10px}
.bub{min-width:170px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid var(--edge);box-shadow:0 2px 10px rgba(31,45,75,.06);cursor:pointer;transition:box-shadow .15s,transform .1s}
.bub:hover{box-shadow:0 4px 16px rgba(31,45,75,.12)}
.bub.on{border-color:var(--accentink);box-shadow:0 0 0 3px var(--ring)}
.b-name{font-weight:700;font-size:14px}
.b-st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accentink);margin:2px 0 4px}
.b-l{font-size:12px;color:var(--muted)}
.b-l.good,td.good{color:var(--good);font-weight:600}
table.cmp{margin-top:12px}
table.cmp td{text-align:center}
table.cmp td.l,td.l{text-align:left}
.cmp-tot{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.stsel{min-width:140px;font-size:12.5px;padding:5px 8px}
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(95,108,125,.45);background:rgba(255,255,255,.85);color:#fff;font-size:13px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;vertical-align:middle}
.chk:not(:disabled):hover{border-color:var(--accentink);box-shadow:0 0 0 3px var(--ring)}
.chk:disabled{cursor:default}
.chk:disabled:not(.on){opacity:.3}
.chk.on{background:var(--good);border-color:var(--good)}
.st-d{margin-left:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.fu-in{width:132px}
.card > .files{margin:0;padding:8px 16px 0}
.card > .files:empty{display:none}
/* style grid */
table.sgrid td{vertical-align:top}
th.fz1,td.fz1{position:sticky;left:0;z-index:3;min-width:124px;width:124px}
th.fz2,td.fz2{position:sticky;left:124px;z-index:3;box-shadow:6px 0 10px -6px rgba(31,45,75,.28)}
thead th.fz1,thead th.fz2{z-index:8}
td.fz1,td.fz2{background:#f6f9fd}
tbody tr:hover td.fz1,tbody tr:hover td.fz2{background:#eef4fb}
input.sty{font-weight:600}
.w-desc{min-width:170px;width:170px}
.w-pkg{min-width:110px;width:110px}
.w-qty{min-width:64px;width:64px}
.w-aw{min-width:118px;width:118px}
textarea.ta{resize:none;overflow:hidden;min-height:30px;line-height:1.3;white-space:pre-wrap;word-break:break-word}
textarea.ta.sm{font-size:11.5px}
.w-qty textarea.ta{text-align:center}
select.won{color:var(--good);font-weight:700}
select.hold{color:var(--warn);font-weight:700}
select.na{color:var(--muted)}
td.fcol{width:1%;white-space:nowrap}
.fcell{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.fr{display:flex;align-items:center;gap:6px}
.fr .cur{color:var(--muted);font-size:10.5px;font-weight:600;min-width:28px;text-align:right;flex:0 0 28px}
.fr input{padding:3px 7px;font-size:12.5px;width:auto}
.fr.note{display:none}
.fr.note.has,td.fcol:focus-within .fr.note{display:flex}
.smp{display:flex;align-items:center;gap:5px;margin-top:2px;padding-left:34px}
.tag{font-size:10px;font-weight:700;color:var(--bad);white-space:nowrap}
.trk{margin-left:8px;font-size:12px;font-weight:600;color:var(--accentink);text-decoration:none;white-space:nowrap}
.month-hd.fold.yr{font-size:15px;font-weight:800}
.month-hd.fold.mo{padding-left:30px}
.hint b{color:var(--accentink)}
.link{color:var(--accentink);text-decoration:none}
.link:hover{text-decoration:underline}

/* ================= v15: Dev Hub landing + one-line header ================= */
.hidden{display:none!important}
.outer{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.outer > #detail{margin:0;max-width:none;width:100%;align-self:stretch}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 2px 0}
.phead h1{margin:0;font-size:19px;font-weight:700;color:var(--ink)}
.ph-sub{font-size:12.5px;color:var(--muted)}
.phead .search{width:260px}
.phead .seg{flex:0 0 auto}
.qlist{padding:0;overflow:hidden}
.qrow{padding:12px 18px;border-bottom:1px solid var(--grid);cursor:pointer;transition:background .13s}
.qrow:last-child{border-bottom:none}
.qrow:hover{background:rgba(255,255,255,.8)}
.qlist .month-hd.fold{border-bottom:1px solid var(--grid);padding:11px 16px}
.banner.big{font-size:13.5px;padding:12px 16px;line-height:1.45}
.banner.big b{margin-right:4px}

<script>
"use strict";

/* ============================== CONFIG ============================== */
const CFG = {
  clientId : "70f97ec1-89f5-43cf-bb49-b28e794c1386",
  tenantId : "eeea7e3e-9ccb-4a16-894e-3417c6a7a4c1",
  host     : "met1sol.sharepoint.com",
  sitePath : "/sites/Production",
  scopes   : ["User.Read", "Sites.ReadWrite.All"],

  listSheets    : "Quote_Sheets",
  listLookups   : "Quote_Lookups",
  listFactories : "Factories",
  listTracker   : "Qoute_Tracker",           // internal-name typo is real
  trackerAlt    : "Quote_Tracker",           // display name
  // Quote Tracker internal field names, copied from its live source FIELD map —
  // authoritative, do not re-detect.
  trackerF      : { style:"Title", desc:"Descr", sheet:"QuoteSheet", img:"ImgKey", date:"QuoteDate", archived:"Archived" },

  attachLibrary : "Quote Sheet Files",
  imgDrive      : "Documents",                       // same store Quote Tracker uses
  imgPath       : "Quote Sheets/Quote Images"        // /thumb + /full inside
};
const keyOf = s => String(s || "").toUpperCase().replace(/[^A-Z0-9_-]/g, "");
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const STEP_FALLBACK = ["Sent Status", "Price Received", "Factory Sample Requested", "Factory Sample Received"];
/* Quote sheet naming: <month code><yy>Q<n> — S26Q20 = September 2026, 20th quote. */
const MONTH_CODES = { JA:0, F:1, MAR:2, AP:3, MAY:4, JUN:5, JUL:6, AU:7, S:8, O:9, N:10, D:11 };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function parseSheet(n){
  const m = String(n || "").trim().toUpperCase().match(/^([A-Z]{1,3})(\d{2})Q(\d+)$/);
  if (!m) return null;
  const mo = MONTH_CODES[m[1]], yr = 2000 + Number(m[2]);
  return { code:m[1], month:mo, year:yr, n:Number(m[3]),
    key: mo == null ? "0000-00" : yr + "-" + String(mo+1).padStart(2,"0"),
    label: mo == null ? "Unknown month" : MONTHS[mo] + " " + yr };
}
const validSheetName = n => { const p = parseSheet(n); return !!(p && p.month != null); };
function nextSheetName(){
  const t = new Date();
  const code = Object.keys(MONTH_CODES).find(k => MONTH_CODES[k] === t.getMonth());
  const yy = String(t.getFullYear()).slice(2);
  let mx = 0;
  S.sheets.map(x => x.name).concat(S.trackerNames).forEach(n => {
    const p = parseSheet(n);
    if (p && p.code === code && String(p.year).slice(2) === yy && p.n > mx) mx = p.n;
  });
  return code + yy + "Q" + String(mx + 1).padStart(2,"0");
}
function fromNow(day){ return Math.round((new Date(day + "T00:00:00") - new Date(dayKey(new Date()) + "T00:00:00")) / 86400000); }
function relFollow(day){ const d = fromNow(day); return d < 0 ? "(" + (-d) + "d overdue)" : d === 0 ? "(today)" : ""; }
const CANON = ["Title","FollowUpDate","FactoriesCsv","FurthestStep","SheetStatus","GridJson"];
const G = "https://graph.microsoft.com/v1.0";

/* ============================== STATE =============================== */
const S = {
  acct:null,
  siteId:null, lists:{}, cols:{}, missingCols:[], driveAttach:null, drivePhoto:null,
  steps:STEP_FALLBACK.slice(), factoryNames:[], facErr:"", trackerNames:[],
  sheets:[], cur:null, curEtag:null, dirty:false, saveTimer:null, conflict:false,
  filesLoaded:false, photos:new Map(), view:"list", filter:"Open", q:"", folds:null, renaming:false, facOpen:new Set()
};

/* ============================== MSAL ================================ */
const redirectUri = window.location.origin + window.location.pathname;
const msalApp = new msal.PublicClientApplication({
  auth:{ clientId:CFG.clientId, authority:"https://login.microsoftonline.com/"+CFG.tenantId, redirectUri },
  cache:{ cacheLocation:"localStorage", storeAuthStateInCookie:false }
});
const framed = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();

async function getToken(){
  const r = await msalApp.acquireTokenSilent({ scopes:CFG.scopes, account:S.acct })
    .catch(async () => framed
      ? msalApp.acquireTokenPopup({ scopes:CFG.scopes })
      : (msalApp.acquireTokenRedirect({ scopes:CFG.scopes }), new Promise(()=>{})));
  return r.accessToken;
}

/* ============================== GRAPH =============================== */
async function gf(path, opts){
  opts = opts || {};
  const tok = await getToken();
  const h = Object.assign({ Authorization:"Bearer "+tok }, opts.headers || {});
  if (opts.body && !(opts.body instanceof ArrayBuffer) && !h["Content-Type"]) h["Content-Type"] = "application/json";
  const url = /^https?:/.test(path) ? path : G + path;
  const res = await fetch(url, { method:opts.method || "GET", headers:h, body:opts.body });
  if (res.status === 429 || res.status === 503){
    await new Promise(r => setTimeout(r, (parseInt(res.headers.get("Retry-After") || "3",10)) * 1000));
    return gf(path, opts);
  }
  if (!res.ok){
    const txt = await res.text().catch(()=> "");
    const err = new Error("Graph " + res.status + " — " + txt.slice(0,240));
    err.status = res.status; err.raw = txt;
    throw err;
  }
  if (res.status === 204 || res.status === 202) return null;
  const ct = res.headers.get("Content-Type") || "";
  return ct.indexOf("json") >= 0 ? res.json() : null;
}
async function gAll(path){
  const out = []; let next = path;
  while (next){
    const p = await gf(next);
    if (p && p.value) out.push.apply(out, p.value);
    next = p && p["@odata.nextLink"] ? p["@odata.nextLink"] : null;
  }
  return out;
}

/* ====================== SITE / LISTS / COLUMNS ====================== */
async function resolveSite(){
  const s = await gf("/sites/" + CFG.host + ":" + CFG.sitePath);
  S.siteId = s.id;
  const lists = await gAll("/sites/" + S.siteId + "/lists?$select=id,name,displayName&$top=300");
  lists.forEach(l => {
    S.lists[l.name] = l.id; S.lists[l.displayName] = l.id;
    S.lists[String(l.name).toLowerCase()] = l.id;
    S.lists[String(l.displayName).toLowerCase()] = l.id;
  });
  const drives = await gAll("/sites/" + S.siteId + "/drives?$select=id,name");
  const pick = n => { const d = drives.find(x => x.name === n); return d ? d.id : null; };
  S.driveAttach = pick(CFG.attachLibrary);
  S.drivePhoto  = pick(CFG.imgDrive) || (drives[0] && drives[0].id) || null;
}
function listId(name){ return S.lists[name] || S.lists[String(name).toLowerCase()] || null; }

/* Map canonical column names to real internal names. Handles the disambiguation
   digit SharePoint appends (LookupType -> LookupType0) and casing drift. */
async function resolveColumns(){
  const id = listId(CFG.listSheets);
  const cols = await gAll("/sites/" + S.siteId + "/lists/" + id + "/columns?$select=name,displayName,readOnly,text&$top=300");
  const writable = cols.filter(c => !c.readOnly);
  const strip = s => String(s).replace(/\d+$/, "").toLowerCase();
  S.cols = {}; S.missingCols = [];
  CANON.forEach(canon => {
    let hit = writable.find(c => c.name === canon)
           || writable.find(c => String(c.name).toLowerCase() === canon.toLowerCase())
           || writable.find(c => strip(c.name) === canon.toLowerCase())
           || writable.find(c => String(c.displayName).toLowerCase() === canon.toLowerCase());
    if (hit) S.cols[canon] = hit.name; else S.missingCols.push(canon);
  });
  /* GridJson holds the whole sheet (factories, styles, prices). As "Single line
     of text" it caps at 255 characters: a new blank sheet fits (~85 chars), the
     first factory or style pushes it over and EVERY save is rejected. That is
     exactly the "0 factories · 0 styles" symptom, so check it up front. */
  S.gridColProblem = "";
  const gc = cols.find(c => c.name === S.cols.GridJson);
  const tx = gc && gc.text;
  if (tx){
    if (tx.allowMultipleLines === false) S.gridColProblem = "The GridJson column is “Single line of text”, which holds only 255 characters — factories, styles and prices can't be saved.";
    else if (tx.appendChangesToExistingText) S.gridColProblem = "The GridJson column has “Append changes to existing text” turned on, so edits are appended instead of saved.";
    else if (tx.textType === "richText") S.gridColProblem = "The GridJson column is set to rich text, which rewraps the data in HTML.";
  }
}
function gridColBanner(){
  const b = el("div","banner bad big");
  b.appendChild(el("b",null,"Nothing is being saved. "));
  b.appendChild(el("span",null,S.gridColProblem + " Fix: Quote_Sheets list → ⚙ List settings → click GridJson → set the type to “Multiple lines of text”, “Plain text”, Append changes = No → OK, then reload this page."));
  return b;
}
const C = k => S.cols[k] || k;
function selectClause(){ return CANON.filter(k => S.cols[k]).map(k => S.cols[k]).join(","); }
function readF(f, k){ return f[C(k)]; }

/* ============================== LOOKUPS ============================= */
async function loadLookups(){
  // Steps
  try {
    const id = listId(CFG.listLookups);
    if (!id) throw new Error('list "' + CFG.listLookups + '" not found');
    const rows = await gAll("/sites/" + S.siteId + "/lists/" + id +
      "/items?expand=fields(select=Title,LookupType0,SortOrder)&$top=500");
    const steps = rows.map(r => r.fields || {})
      .filter(f => String(f.LookupType0 || "") === "QuoteStep")
      .sort((a,b) => (Number(a.SortOrder)||0) - (Number(b.SortOrder)||0))
      .map(f => String(f.Title || "").trim()).filter(Boolean);
    void steps;   // steps are fixed in code now (STEP_FALLBACK); QuoteStep rows are no longer read
  } catch(e){ console.warn("Step lookup failed, using fallback:", e.message); }

  // Factories — same approach as Quote Tracker: expand ALL fields, coalesce the
  // name from Title / Supplier / Factory / FactoryName / Name per row.
  S.factoryNames = []; S.facErr = "";
  try {
    const id = listId(CFG.listFactories);
    if (!id){ S.facErr = 'No list named "' + CFG.listFactories + '" on ' + CFG.sitePath + '.'; }
    else {
      const rows = await gAll("/sites/" + S.siteId + "/lists/" + id + "/items?$expand=fields&$top=999");
      const names = new Set();
      rows.forEach(r => {
        const fl = r.fields || {};
        const v = fl.Title || fl.Supplier || fl.Factory || fl.FactoryName || fl.Name;
        if (v) names.add(String(v).trim());
      });
      S.factoryNames = Array.from(names).sort((a,b) => a.localeCompare(b));
      if (!S.factoryNames.length) S.facErr = "Factories list read OK but every row is blank in Title/Supplier/Factory/FactoryName/Name.";
    }
  } catch(e){ S.facErr = "Factories list error — " + (e.message || ""); }
}

/* ============================ IMPORT ================================
   One reader for every workbook the team handles:
     comparison sheet — Style # | Picture | Description | Package | Qty | Option |
                        then per factory "<F>" (price), "<F> MOQ", "<F> pic" (notes)
     plain quote sheet — same fixed columns + blank Price / MOQ, no factories
     returned factory sheet — a plain sheet with Price / MOQ filled in; the factory
                        comes from the file name (Quote_S26Q07_Darong.xlsx, which is
                        how our export names them) or is asked for once
   Tightened (10/2026): first visible worksheet; header row found within the first
   6 rows; headers normalized (case, spaces, #, punctuation); repeated header rows,
   TOTAL rows and blank-style rows skipped; duplicate styles inside one file merged
   and counted. Additive only — fills empty cells, never overwrites. */
function cellText(c){
  if (!c) return "";
  let v = c.master ? c.master.value : c.value;     // merged cells read through to their master (copy-down)
  if (v == null) return "";
  if (typeof v === "object"){
    if (v.richText) return v.richText.map(t => t.text).join("");
    if (v.text) return String(v.text);
    if (v.result != null) return String(v.result);
    if (v instanceof Date) return v.toLocaleDateString();
  }
  return String(v);
}
const normH = h => String(h || "").toLowerCase().replace(/[#.:]/g, " ").replace(/\s+/g, " ").trim();
const alnum = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const FIXED = [
  ["style", h => /^style( no| number)?$/.test(h) || /^style\b/.test(h)],
  ["pic",   h => /^(pic|pics|picture|pictures|image|images|photo|photos)$/.test(h)],
  ["desc",  h => /^desc/.test(h)],
  ["pkg",   h => /^pack/.test(h)],
  ["qty",   h => /^(qty|quantity|order qty)$/.test(h)],
  ["opt",   h => /^option/.test(h)]
];
const GENERIC = { price:/^(price|prices|unit price|fob|fob price|cost)$/, moq:/^moq$/, note:/^(note|notes|remark|remarks|comment|comments)$/ };
const IGNORE = /^(total|totals|target|target price|no|item)$/;

function mapWorkbook(ws){
  let hr = 0;
  for (let r = 1; r <= Math.min(6, ws.rowCount); r++){
    const row = ws.getRow(r);
    for (let c = 1; c <= Math.max(ws.columnCount, 1); c++){
      if (/^style\b/.test(normH(cellText(row.getCell(c))))){ hr = r; break; }
    }
    if (hr) break;
  }
  if (!hr) throw new Error('No "Style #" header in the first 6 rows — is this a quote or comparison sheet?');
  const H = {}, G = {}, facs = [];
  const fac = name => { let f = facs.find(x => alnum(x.name) === alnum(name)); if (!f){ f = { name:name.trim(), price:null, moq:null, note:null }; facs.push(f); } return f; };
  const row = ws.getRow(hr);
  for (let c = 1; c <= ws.columnCount; c++){
    const raw = cellText(row.getCell(c)).trim(), h = normH(raw);
    if (!h || IGNORE.test(h)) continue;
    const fx = FIXED.find(f => f[1](h));
    if (fx && H[fx[0]] == null){ H[fx[0]] = c; continue; }
    const gk = Object.keys(GENERIC).find(k => GENERIC[k].test(h));
    if (gk){ if (G[gk] == null) G[gk] = c; continue; }
    let m;
    if ((m = raw.match(/^(.*?)\s*pic(ture)?s?\s*$/i)) && m[1].trim()){ fac(m[1]).note = c; continue; }
    if ((m = raw.match(/^(.*?)\s*moq\s*$/i)) && m[1].trim()){ fac(m[1]).moq = c; continue; }
    if ((m = raw.match(/^(.*?)\s*(price|notes?)\s*$/i)) && m[1].trim()){ const f = fac(m[1]); if (/price/i.test(m[2])) f.price = c; else f.note = c; continue; }
    const f = fac(raw); if (f.price == null) f.price = c;
  }
  if (H.style == null) throw new Error('No "Style #" column found');
  return { hr:hr, H:H, G:G, facs:facs.filter(f => f.price != null || f.moq != null) };
}
function factoryFromFileName(fn, g){
  const base = String(fn || "").replace(/\.(xlsx?|xlsm)$/i, "");
  const cands = g.factories.map(f => f.name).concat(S.factoryNames);
  const b = alnum(base);
  let best = "";
  cands.forEach(n => { const a = alnum(n); if (a.length >= 3 && b.indexOf(a) >= 0 && a.length > alnum(best).length) best = n; });
  return best;
}
/* Ask which factory a returned sheet belongs to (only when the file name doesn't say). */
function pickFactory(fileName, g){
  return new Promise(res => {
    const dlg = $("#facDlg"), sel = $("#facSel");
    sel.innerHTML = "";
    sel.appendChild(new Option("— just add the styles, skip prices —", ""));
    const names = g.factories.map(f => f.name);
    S.factoryNames.forEach(n => { if (names.indexOf(n) < 0) names.push(n); });
    names.forEach(n => sel.appendChild(new Option(n, n)));
    $("#facSub").textContent = fileName + " has a Price column but the file name doesn't say which factory returned it.";
    const done = v => { dlg.close(); $("#facOk").onclick = null; $("#facCancel").onclick = null; res(v); };
    $("#facOk").onclick = () => done(sel.value);
    $("#facCancel").onclick = () => done("");
    dlg.showModal();
  });
}
function ensureFactory(g, name){
  let f = g.factories.find(x => alnum(x.name) === alnum(name));
  if (!f){
    f = { id:uid(), name:name, notes:"", follow:"", steps:g.steps.map(() => null) };
    g.factories.push(f);
    g.styles.forEach(st => { st.cells[f.id] = blankCell(); });
    return { f:f, added:true };
  }
  return { f:f, added:false };
}
async function importComparison(file){
  if (!S.cur) return;
  const g = S.cur.grid;
  S.syncMsg = "Reading " + file.name + "…"; renderAll();
  const out = { addF:0, addS:0, cells:0, dups:0, skipped:0, priced:{}, bench:0, photos:0 };
  try {
    if (typeof ExcelJS === "undefined") throw new Error("Excel library did not load (cdnjs blocked?)");
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    const ws = wb.worksheets.find(w => w.state !== "hidden" && w.state !== "veryHidden") || wb.worksheets[0];
    if (!ws) throw new Error("Workbook has no sheets");
    const M = mapWorkbook(ws), H = M.H;
    const prior = g.imports.find(x => x.name === file.name);

    if (!String(g.desc || "").trim()){
      const dsc = descFromFile(file.name, sheetNameFromFile(file.name) || S.cur.name);
      if (dsc){ g.desc = dsc; const r0 = S.sheets.find(x => x.id === S.cur.id); if (r0) r0.desc = dsc; }
    }

    // returned single-factory sheet → generic Price/MOQ/Notes belong to one factory
    let single = null;
    if (!M.facs.length && (M.G.price != null || M.G.moq != null)){
      let anyVal = false;
      for (let r = M.hr + 1; r <= ws.rowCount && !anyVal; r++){
        const rw = ws.getRow(r);
        if ((M.G.price != null && cellText(rw.getCell(M.G.price)).trim()) || (M.G.moq != null && cellText(rw.getCell(M.G.moq)).trim())) anyVal = true;
      }
      if (anyVal){
        const nm = factoryFromFileName(file.name, g) || await pickFactory(file.name, g);
        if (nm) single = { name:nm, price:M.G.price, moq:M.G.moq, note:M.G.note };
      }
    }
    const facCols = single ? [single] : M.facs;
    const fidBy = {};
    facCols.forEach(fc => { const r = ensureFactory(g, fc.name); fidBy[fc.name] = r.f.id; if (r.added) out.addF++; });

    const seen = new Set(), rowStyle = {};
    const norm = x => String(x || "").trim().toUpperCase();
    for (let r = M.hr + 1; r <= ws.rowCount; r++){
      const row = ws.getRow(r);
      const styleV = cellText(row.getCell(H.style)).replace(/\s+/g, " ").trim();
      if (!styleV){ continue; }
      if (/^style\b/i.test(styleV) || /^total/i.test(styleV)){ out.skipped++; continue; }
      if (seen.has(norm(styleV))) out.dups++;
      seen.add(norm(styleV)); rowStyle[r] = styleV;
      let st = g.styles.find(x => norm(x.style) === norm(styleV));
      if (!st){
        st = { id:uid(), style:styleV, desc:"", pkg:"", qty:"", opt:"", winner:"", cells:{} };
        g.factories.forEach(f => { st.cells[f.id] = blankCell(); });
        g.styles.push(st); out.addS++;
      }
      const fill = (k, col) => {
        if (col == null) return;
        const v = cellText(row.getCell(col)).trim();
        if (v && !String(st[k] || "").trim()){ st[k] = v; out.cells++; }
      };
      fill("desc", H.desc); fill("pkg", H.pkg); fill("qty", H.qty); fill("opt", H.opt);
      facCols.forEach(fc => {
        const fid = fidBy[fc.name];
        const cell = st.cells[fid] || (st.cells[fid] = blankCell());
        const put = (k, col) => {
          if (col == null) return;
          const v = cellText(row.getCell(col)).trim();
          if (v && !String(cell[k] || "").trim()){ cell[k] = v; out.cells++; if (k === "price") out.priced[fid] = (out.priced[fid] || 0) + 1; }
        };
        put("price", fc.price); put("moq", fc.moq); put("note", fc.note);
      });
    }

    // a factory that sent prices has, by definition, reached "Price received"
    const pIdx = priceStepIdx(g);
    const ticked = [];
    Object.keys(out.priced).forEach(fid => {
      const f = g.factories.find(x => x.id === fid);
      if (f && pIdx >= 0 && facDoneCount(f) <= pIdx){ setStatus(f, pIdx); ticked.push(f.name); }
    });

    g.imports.push({ name:file.name, at:new Date().toISOString() });
    touch(); renderAll();
    await loadPhotos();   // must KNOW which styles already have photos before uploading any

    // embedded pictures: Picture column → shared quote image (only when none exists);
    // factory "pic" columns → benchmark photos saved as named attachments
    const media = (wb.model && wb.model.media) || [];
    const benchCol = {};
    facCols.forEach(fc => { if (fc.note != null && !single) benchCol[fc.note - 1] = fc.name; });
    await loadFiles();
    const have = new Set((S.cur.files || []).map(x => x.name.toLowerCase())), perCell = {};
    for (const im of ws.getImages()){
      const tl = im.range && im.range.tl; if (!tl) continue;
      const col = Math.round(tl.nativeCol != null ? tl.nativeCol : tl.col);
      const rw  = Math.round(tl.nativeRow != null ? tl.nativeRow : tl.row) + 1;
      const styleV = rowStyle[rw] || rowStyle[rw + 1];
      if (!styleV) continue;
      const m = media[im.imageId] || media.find(x => String(x.index) === String(im.imageId));
      if (!m || !m.buffer) continue;
      const ext = (m.extension || "png").toLowerCase();
      const blob = new Blob([m.buffer], { type:"image/" + (ext === "jpg" ? "jpeg" : ext) });
      if (H.pic != null && col === H.pic - 1){
        const key = keyOf(styleV);
        if (!key || S.photos.get(key) !== null) continue;   // null = confirmed absent; anything else = keep
        try { if (await uploadImage(styleV, blob)) out.photos++; } catch(e){ console.warn("Photo failed for " + styleV, e.message); }
      } else if (benchCol[col] != null){
        const base = (styleV + "_" + benchCol[col]).replace(/[\\/:*?"<>|]+/g, "-"), ck = base + "." + ext;
        perCell[ck] = (perCell[ck] || 0) + 1;                      // 2nd image in the same cell → _2
        const nm = base + (perCell[ck] > 1 ? "_" + perCell[ck] : "") + "." + ext;
        if (have.has(nm.toLowerCase())) continue;
        try { await putAttachment(nm, blob); have.add(nm.toLowerCase()); out.bench++; } catch(e){ console.warn("Benchmark photo failed", e.message); }
      }
    }
    // the imported workbook itself is kept on the sheet under its original name
    if (!have.has(String(file.name).toLowerCase())){
      try { await putAttachment(file.name, file); } catch(e){ console.warn("Attach original failed", e.message); }
    }
    await loadFiles();

    const bits = [];
    if (prior) bits.push("already imported " + fmtDayIso(prior.at) + " — blanks filled only");
    if (out.addF) bits.push("+" + out.addF + " factor" + (out.addF === 1 ? "y" : "ies"));
    bits.push("+" + out.addS + " style" + (out.addS === 1 ? "" : "s"));
    bits.push(out.cells + " cells filled");
    if (single && Object.keys(out.priced).length) bits.push("prices for " + single.name);
    if (ticked.length) bits.push("Price received ✓ " + ticked.join(", "));
    if (out.photos) bits.push(out.photos + " quote photo" + (out.photos === 1 ? "" : "s"));
    if (out.bench) bits.push(out.bench + " benchmark photo" + (out.bench === 1 ? "" : "s") + " attached");
    if (out.dups) bits.push(out.dups + " duplicate row" + (out.dups === 1 ? "" : "s") + " merged");
    if (out.skipped) bits.push(out.skipped + " header/total row" + (out.skipped === 1 ? "" : "s") + " skipped");
    S.syncMsg = "Imported " + file.name + ": " + bits.join(" · ") + ". Nothing was overwritten.";
  } catch(e){
    console.error(e);
    S.syncMsg = "Import failed — " + (e.message || "");
  }
  renderAll();
}

/* ============================ EXPORT ================================
   Photo embedding is ported from Quote Tracker's export (fetch the thumb by its
   download URL, fall back to Graph /content; centre it in the cell). */
const colPx = ch => Math.round(ch * 7 + 5), ptPx = pt => Math.round(pt * 96 / 72);
const PHOTO_INSET = 0.86, PIC_W = 14, PIC_ROW = 60;
function fitPhoto(colIdx, colChars, rowPt, rowIdx, d){
  const cellW = colPx(colChars), cellH = ptPx(rowPt);
  const sc = Math.min(cellW * PHOTO_INSET / d.w, cellH * PHOTO_INSET / d.h);
  const w = Math.max(1, Math.round(d.w * sc)), h = Math.max(1, Math.round(d.h * sc));
  return { tl:{ col:colIdx + ((cellW - w) / 2) / cellW, row:rowIdx + ((cellH - h) / 2) / cellH }, ext:{ width:w, height:h }, editAs:"oneCell" };
}
const blobDims = async blob => {
  try { const bm = await createImageBitmap(blob); const d = { w:bm.width, h:bm.height }; if (bm.close) bm.close(); return d; }
  catch(e){ return { w:360, h:360 }; }
};
async function imageBytes(style){
  const key = keyOf(style); if (!key) return null;
  const url = S.photos.get(key);
  if (url){ try { const r = await fetch(url); if (r.ok) return await r.blob(); } catch(e){} }
  if (!S.drivePhoto) return null;
  try {
    const r = await fetch(G + "/drives/" + S.drivePhoto + "/root:/" + encPath(CFG.imgPath) + "/thumb/" + encodeURIComponent(key) + ".jpg:/content",
      { headers:{ Authorization:"Bearer " + (await getToken()) } });
    if (r.ok) return await r.blob();
  } catch(e){}
  return null;
}
/* cols: [{h, w, k?, pic?, wrap?}] ; rows: arrays aligned to cols (pic cells = style string) */
async function writeWorkbook(fileName, sheetName, cols, rows){
  if (typeof ExcelJS === "undefined"){ setSaveState("err","Excel library did not load"); return; }
  setSaveState("saving"); $("#saveState").lastChild.textContent = "Building " + fileName + "…";
  const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet(sheetName || "Sheet1");
  const BORDER = { top:{style:"thin"}, left:{style:"thin"}, bottom:{style:"thin"}, right:{style:"thin"} };
  const picIdx = cols.findIndex(c => c.pic);
  const hr = ws.addRow(cols.map(c => c.h));
  hr.height = 30;
  hr.eachCell(c => { c.font = { name:"Calibri", size:11, bold:true }; c.border = BORDER; c.alignment = { horizontal:"center", vertical:"middle", wrapText:true }; });
  rows.forEach(r => {
    const row = ws.addRow(cols.map((c,i) => c.pic ? null : (r[i] == null ? "" : r[i])));
    if (picIdx >= 0) row.height = PIC_ROW;
    row.eachCell({ includeEmpty:true }, (c,i) => { const spec = cols[i-1]; if (!spec) return;
      c.font = { name:"Calibri", size:11 }; c.border = BORDER;
      c.alignment = { horizontal:"center", vertical:"middle", wrapText:!!spec.wrap }; });
  });
  cols.forEach((c,i) => { ws.getColumn(i+1).width = c.pic ? PIC_W : c.w; });
  ws.views = [{ state:"frozen", ySplit:1 }];
  if (picIdx >= 0){
    for (let n = 0; n < rows.length; n++){
      const blob = await imageBytes(rows[n][picIdx]);
      if (!blob) continue;
      const d = await blobDims(blob);
      const id = wb.addImage({ buffer:await blob.arrayBuffer(), extension:"jpeg" });
      ws.addImage(id, fitPhoto(picIdx, PIC_W, PIC_ROW, n + 1, d));
    }
  }
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = fileName.replace(/[\\/:*?"<>|]+/g, "-");
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  setSaveState("saved"); $("#saveState").lastChild.textContent = "Exported " + a.download;
}
const safe = s => String(s || "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
function sheetBase(){ const c = S.cur; return c.name + (c.grid.desc ? "_" + safe(c.grid.desc) : ""); }
const FIX_COLS = [
  { h:"Style #", w:16 }, { h:"Picture", pic:true }, { h:"Description", w:34, wrap:true },
  { h:"Package", w:24, wrap:true }, { h:"Qty", w:9 }, { h:"Option", w:14, wrap:true }
];
const fixRow = st => [st.style, st.style, st.desc, st.pkg, st.qty, st.opt];
function awardLabel(g, w){ if (w === AWARD_NA) return "N/A"; if (w === AWARD_HOLD) return "Hold"; const f = g.factories.find(x => x.id === w); return f ? f.name : ""; }

/* the blank sheet a factory fills in (Price / MOQ / Notes), with photos */
function exportFactoryWorkbook(fid){
  const g = S.cur.grid, fac = fid ? g.factories.find(f => f.id === fid) : null;
  const cols = FIX_COLS.concat([{ h:"Price", w:10 }, { h:"MOQ", w:10 }, { h:"Notes", w:26, wrap:true }]);
  return writeWorkbook("Quote_" + S.cur.name + (fac ? "_" + safe(fac.name) : "") + ".xlsx", S.cur.name, cols,
    g.styles.map(st => fixRow(st).concat(["", "", ""])));
}
/* the team's Comparison workbook — re-importable: <F> | <F> MOQ | <F> pic (notes) */
function exportCompare(){
  const g = S.cur.grid;
  const cols = FIX_COLS.concat([{ h:"Awarded", w:14 }]);
  g.factories.forEach(f => { cols.push({ h:f.name, w:11 }, { h:f.name + " MOQ", w:10 }, { h:f.name + " pic", w:26, wrap:true }); });
  return writeWorkbook("Comparison_" + sheetBase() + ".xlsx", S.cur.name, cols, g.styles.map(st => {
    const r = fixRow(st).concat([awardLabel(g, st.winner)]);
    g.factories.forEach(f => { const c = st.cells[f.id] || {}; r.push(c.price || "", c.moq || "", c.note || ""); });
    return r;
  }));
}
function exportStatus(){
  const g = S.cur.grid;
  const cols = [{ h:"Factory", w:20 }, { h:"Status", w:18 }].concat(g.steps.map(s => ({ h:s, w:14 }))).concat([{ h:"Follow up", w:12 }, { h:"Notes", w:34, wrap:true }]);
  return writeWorkbook("Status_" + sheetBase() + ".xlsx", S.cur.name, cols, g.factories.map(f => {
    const k = facDoneCount(f);
    return [f.name, k ? g.steps[k-1] : "Not started"].concat(f.steps.map(st => st ? fmtDayIso(st.at) : "")).concat([f.follow ? fmtDayIso(f.follow) : "", f.notes || ""]);
  }));
}
function exportSamples(){
  const g = S.cur.grid, rows = [];
  g.styles.forEach(st => g.factories.forEach(f => { const sm = (st.cells[f.id] || {}).sample; if (sm && sm.req) rows.push([st.style, st.style, f.name, fmtDayIso(sm.req.at), sm.tracking || "", sm.ship ? fmtDayIso(sm.ship) : "", sm.rec ? fmtDayIso(sm.rec.at) : ""]); }));
  return writeWorkbook("Samples_" + sheetBase() + ".xlsx", S.cur.name,
    [{ h:"Style #", w:16 }, { h:"Picture", pic:true }, { h:"Factory", w:18 }, { h:"Requested", w:12 }, { h:"Tracking #", w:24 }, { h:"Ship date", w:12 }, { h:"Received", w:12 }], rows);
}

/* ======================= NEW SHEET / HOME IMPORT ======================
   You type only the description; the number is always the next of the month.
   Duplicate check: a sheet with the same description, or one that already
   imported the same file, is flagged before anything is created. */
let pendingImport = null;
function similarSheet(desc, fileName){
  const d = String(desc || "").trim().toLowerCase();
  return S.sheets.find(x => (d && String(x.desc || "").trim().toLowerCase() === d) ||
                            (fileName && (x.imports || []).indexOf(fileName) >= 0)) || null;
}
function openNewDialog(file){
  loadTracker().then(() => { if ($("#newDlg").open) newCheck(); });   // numbering must see Quote Tracker's numbers too
  pendingImport = file || null;
  $("#newDesc").value = file ? descFromFile(file.name, "") : "";
  $("#newSub").textContent = file ? "From " + file.name : "The sheet number is assigned automatically";
  newCheck();
  $("#newDlg").showModal();
  const i = $("#newDesc"); i.focus(); i.select();
}
function newCheck(){
  const desc = ($("#newDesc").value || "").trim();
  const nm = nextSheetName(), sim = similarSheet(desc, pendingImport && pendingImport.name);
  $("#newName").textContent = S.trackerReady ? nm + " · " + (parseSheet(nm) || {}).label : "checking Quote Tracker numbers…";
  const err = $("#newErr"), use = $("#newUse");
  if (sim){
    err.className = "err"; err.textContent = sim.name + (sim.desc ? " · " + sim.desc : "") + " looks like the same quote.";
    use.style.display = ""; use.textContent = "Open " + sim.name + (pendingImport ? " & import there" : ""); use.dataset.id = sim.id;
  } else { err.className = "err"; err.textContent = ""; use.style.display = "none"; }
  $("#newCreate").disabled = !desc || !S.trackerReady;
  return desc;
}
function sheetNameFromFile(fn){
  // no \b here: underscore is a word char, so _AU26Q04_ would never match
  const m = String(fn || "").toUpperCase().match(/(?:^|[^A-Z0-9])([A-Z]{1,3}\d{2}Q\d{2,3})(?![A-Z0-9])/);
  return m && validSheetName(m[1]) ? m[1] : "";
}
/* Comparison_AU26Q04_Patrick_Ta_Skin_Care.xlsx → "Patrick Ta Skin Care" */
function descFromFile(fn, name){
  let t = String(fn || "").replace(/\.(xlsx?|xlsm)$/i, "").replace(/[_\-]+/g, " ");   // separators first — \b ignores "_"
  if (name) t = t.replace(new RegExp(name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), " ");
  t = t.replace(/\b(comparison|comp|quote|quotes|sheet|quotesheet)\b/ig, " ");
  return t.replace(/\s+/g, " ").trim();
}
async function importFromHome(file){
  const norm = x => String(x || "").trim().toUpperCase();
  const name = sheetNameFromFile(file.name);
  if (name){
    const hit = S.sheets.find(sh => norm(sh.name) === norm(name));
    if (hit) await openSheet(hit.id); else await createSheet(name, descFromFile(file.name, name));
    await importComparison(file);
    return;
  }
  const again = S.sheets.find(x => (x.imports || []).indexOf(file.name) >= 0);
  if (again){ await openSheet(again.id); await importComparison(file); return; }
  const desc = descFromFile(file.name, "");
  if (similarSheet(desc, null) || !desc){ openNewDialog(file); return; }
  await loadTracker();
  await createSheet(nextSheetName(), desc);
  await importComparison(file);
}

let trackerLoaded = null;
function loadTracker(){ return trackerLoaded || (trackerLoaded = loadTrackerNow()); }
async function loadTrackerNow(){
  try {
    const id = listId(CFG.listTracker) || listId(CFG.trackerAlt);
    if (!id) return;
    const F = CFG.trackerF;
    const rows = await gAll("/sites/" + S.siteId + "/lists/" + id +
      "/items?expand=fields(select=" + [F.sheet,F.archived].join(",") + ")&$top=5000");
    S.trackerNames = rows.map(r => r.fields || {})
      .filter(f => !String(f[F.archived] || "").trim())
      .map(f => String(f[F.sheet] || "").trim()).filter(Boolean)
      .filter((v,i,a) => a.indexOf(v) === i).sort((a,b) => a.localeCompare(b));
    if (S.view === "detail") renderAll();
  } catch(e){ console.warn("Quote Tracker unreachable:", e.message); }
  S.trackerReady = true;
}
async function loadSheets(){
  const id = listId(CFG.listSheets);
  const rows = await gAll("/sites/" + S.siteId + "/lists/" + id +
    "/items?expand=fields(select=" + selectClause() + ")&$top=500");
  S.sheets = rows.map(r => {
    const f = r.fields || {};
    const raw = readF(f,"GridJson") || "";
    let g = null;
    try { g = raw ? normalize(JSON.parse(raw)) : null; } catch(e){ g = null; }
    if (!g) g = normalize(blankGrid());
    return {
      id:r.id,
      name:readF(f,"Title") || "(untitled)",
      follow:readF(f,"FollowUpDate") || null,
      status:readF(f,"SheetStatus") || "Active",
      facs:String(readF(f,"FactoriesCsv") || ""),
      desc:g.desc, nFiles:g.nFiles, imports:g.imports.map(x => x.name),
      created:r.createdDateTime || "", raw:raw, etag:r.eTag || "",
      st:sheetStats(g)
    };
  });
  // newest created first
  S.sheets.sort((a,b) => String(b.created).localeCompare(String(a.created)) ||
    b.name.localeCompare(a.name, undefined, { numeric:true }));
}

/* ============================== UTIL ================================ */
const $  = s => document.querySelector(s);
const el = (t,c,x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = () => Math.random().toString(36).slice(2,9);
function dayKey(d){ const p = n => String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function nextCalendarDay(from){ return dayKey(new Date(from.getFullYear(), from.getMonth(), from.getDate()+1)); }
function fmtStamp(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  let h = d.getHours(); const ap = h >= 12 ? "p" : "a"; h = h % 12 || 12;
  return (d.getMonth()+1)+"/"+d.getDate()+"/"+String(d.getFullYear()).slice(2)+" "+h+":"+String(d.getMinutes()).padStart(2,"0")+ap;
}
function fmtDayIso(iso){ const d = String(iso || "").slice(0,10).split("-"); return d.length === 3 ? Number(d[1]) + "/" + Number(d[2]) + "/" + d[0] : ""; }
function fmtSize(b){ if (b == null) return ""; if (b < 1024) return b+" B"; if (b < 1048576) return (b/1024).toFixed(0)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
const AWARD_NA = "NA", AWARD_HOLD = "HOLD";
function blankGrid(){ return { v:1, steps:S.steps.slice(), factories:[], styles:[], imports:[] }; }
function blankCell(){ return { moq:"", price:"", note:"", sample:null }; }
function normalize(g){
  g = g && typeof g === "object" ? g : {};
  g.v = 1;
  g.steps = Array.isArray(g.steps) && g.steps.length ? g.steps : S.steps.slice();
  g.factories = Array.isArray(g.factories) ? g.factories : [];
  g.styles = Array.isArray(g.styles) ? g.styles : [];
  g.imports = Array.isArray(g.imports) ? g.imports : [];
  g.desc = String(g.desc || ""); g.nFiles = Number(g.nFiles) || 0;
  if (g.steps.join("|") !== S.steps.join("|")){
    g.factories.forEach(f => {
      const old = Array.isArray(f.steps) ? f.steps : [], kept = [];
      for (const st of old){ if (st) kept.push(st); else break; }
      f.steps = S.steps.map((_, i) => kept[i] || null);
    });
    g.steps = S.steps.slice();
  }
  const n = g.steps.length;
  g.factories.forEach(f => {
    f.id = f.id || uid(); f.name = f.name || ""; f.notes = f.notes || ""; f.follow = f.follow || "";
    f.steps = Array.isArray(f.steps) ? f.steps : [];
    while (f.steps.length < n) f.steps.push(null);
    f.steps.length = n;
  });
  g.styles.forEach(s => {
    s.id = s.id || uid(); s.style = s.style || ""; s.desc = s.desc || "";
    s.pkg = s.pkg || ""; s.qty = s.qty || ""; s.opt = s.opt || ""; s.winner = s.winner || "";
    s.cells = s.cells && typeof s.cells === "object" ? s.cells : {};
    g.factories.forEach(f => {
      const c = s.cells[f.id] || (s.cells[f.id] = blankCell());
      c.moq = c.moq || ""; c.price = c.price || ""; c.note = c.note || ""; c.sample = c.sample || null;
    });
  });
  return g;
}
const isFacAward = (g, w) => !!w && w !== AWARD_NA && w !== AWARD_HOLD && g.factories.some(f => f.id === w);
function priceStepIdx(g){ return g.steps.findIndex(s => /price/i.test(s)); }
function numOf(v){   // "1.12", "$1,120", "5k" → number; anything else NaN
  const m = String(v || "").trim().toLowerCase().replace(/[$,\s]/g, "").match(/^(\d+(?:\.\d+)?)(k|m)?$/);
  return m ? Number(m[1]) * (m[2] === "k" ? 1e3 : m[2] === "m" ? 1e6 : 1) : NaN;
}
const money = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
function facDoneCount(f){ let c = 0; for (const st of f.steps){ if (st) c++; else break; } return c; }
function sheetStats(g){
  const nSteps = g.steps.length || 1, facs = g.factories;
  let needTrack = 0, sampReq = 0, sampRec = 0;
  g.styles.forEach(s => Object.keys(s.cells).forEach(fid => {
    const sm = s.cells[fid] && s.cells[fid].sample;
    if (sm && sm.req){ sampReq++; if (sm.rec) sampRec++; else if (!String(sm.tracking || "").trim()) needTrack++; }
  }));
  return {
    nf:facs.length, nStyles:g.styles.length, nSteps:nSteps,
    done: facs.length > 0 && facs.every(f => facDoneCount(f) >= nSteps),
    progress: facs.length ? facs.reduce((a,f) => a + facDoneCount(f) / nSteps, 0) / facs.length : 0,
    nWon: g.styles.filter(s => isFacAward(g, s.winner)).length,
    nPending: g.styles.filter(s => !isFacAward(g, s.winner) && s.winner !== AWARD_NA).length,   // blank + Hold
    needTrack:needTrack, sampReq:sampReq, sampRec:sampRec
  };
}
/* Status dropdown / tick: step k and everything before it get stamped (existing
   stamps kept); everything after k is cleared. k = -1 clears all. Full ISO time
   is stored; the UI shows the date only. */
function setStatus(f, k){
  const now = new Date(), who = (S.acct && S.acct.name) || "";
  for (let i = 0; i < f.steps.length; i++){
    if (i <= k){ if (!f.steps[i]) f.steps[i] = { at:now.toISOString(), by:who }; }
    else f.steps[i] = null;
  }
  if (k >= 0) recomputeFollow(f);
  if (S.cur) S.cur.follow = derivedFollow(S.cur.grid, S.cur.follow);
}
/* For now: follow up 1 day after the last completed step (none once all are done). */
function recomputeFollow(f){
  const k = facDoneCount(f);
  if (k >= f.steps.length){ f.follow = ""; return; }
  if (k > 0) f.follow = nextCalendarDay(new Date(f.steps[k-1].at));
}
const sampleStepIdx = (g, what) => g.steps.findIndex(x => new RegExp("sample.*" + what, "i").test(x));
/* Item-level samples drive the factory's two sample steps: the first request ticks
   "Factory Sample Requested"; once every requested sample is in, "…Received" ticks. */
function autoSampleSteps(g, f){
  const reqs = g.styles.map(st => (st.cells[f.id] || {}).sample).filter(sm => sm && sm.req);
  const qi = sampleStepIdx(g, "req"), ri = sampleStepIdx(g, "rec");
  if (qi >= 0 && reqs.length && facDoneCount(f) <= qi) setStatus(f, qi);
  if (ri >= 0 && reqs.length && reqs.every(sm => sm.rec) && facDoneCount(f) <= ri) setStatus(f, ri);
}
/* Share of this sheet's styles awarded to the factory. */
function facAwardShare(g, f){
  const n = g.styles.length, won = g.styles.filter(st => st.winner === f.id).length;
  return { won:won, n:n, frac: n ? won / n : 0 };
}

/* Sheet follow-up = earliest per-factory follow among factories still mid-flow.
   Falls back to the legacy sheet-level date while no factory dates exist. */
function derivedFollow(g, legacy){
  const open = g.factories.filter(f => f.steps.some(st => !st));
  if (g.factories.length && !open.length) return "";        // every factory finished — nothing to chase
  const ds = open.map(f => f.follow).filter(Boolean).sort();
  return ds.length ? ds[0] : (g.factories.length ? "" : (legacy || ""));
}
function followFactory(g){
  const open = g.factories.filter(f => f.steps.some(st => !st) && f.follow);
  if (!open.length) return "";
  open.sort((a,b) => a.follow < b.follow ? -1 : 1);
  return open[0].name;
}
function furthest(g){
  let m = 0;
  g.factories.forEach(f => { let c = 0; for (let i=0;i<f.steps.length;i++){ if (f.steps[i]) c++; else break; } if (c>m) m=c; });
  return m;
}

/* ============================== SAVE ================================ */
function setSaveState(kind, msg){
  const n = $("#saveState");
  n.className = "save" + (kind === "err" ? " err" : "");
  n.innerHTML = "";
  if (kind === "saving"){ n.appendChild(el("div","spin")); n.appendChild(el("span",null,"Saving…")); }
  else if (kind === "saved") n.appendChild(el("span",null,"Saved " + fmtStamp(new Date().toISOString())));
  else if (kind === "err") n.appendChild(el("span",null, msg || "Save failed"));
}
function touch(){
  if (!S.cur || S.conflict) return;
  S.dirty = true;
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(save, 800);
}
function buildFields(c){
  const f = {};
  const put = (k,v) => { if (S.cols[k] && v !== null && v !== undefined && v !== "") f[S.cols[k]] = v; };
  put("Title", c.name || "(untitled)");
  const df = derivedFollow(c.grid, c.follow);
  c.follow = df;
  put("FollowUpDate", df ? df + "T00:00:00Z" : "");   // omitted when blank — null here is a common 400
  put("FactoriesCsv", c.grid.factories.map(x => x.name).filter(Boolean).join(", "));
  if (S.cols.FurthestStep) f[S.cols.FurthestStep] = furthest(c.grid);
  put("SheetStatus", c.status || "Active");
  put("GridJson", JSON.stringify(c.grid));
  return f;
}
async function save(){
  if (!S.cur || !S.dirty || S.conflict) return;
  const c = S.cur, fields = buildFields(c);
  const url = "/sites/" + S.siteId + "/lists/" + listId(CFG.listSheets) + "/items/" + c.id + "/fields";
  setSaveState("saving");
  try {
    const r = await gf(url, { method:"PATCH", headers:{ "If-Match": S.curEtag || "*" }, body:JSON.stringify(fields) });
    S.dirty = false; S.saveErr = ""; setSaveState("saved");
    if (r && r["@odata.etag"]) S.curEtag = r["@odata.etag"]; else await refreshEtag();
    const row = S.sheets.find(s => s.id === c.id);
    if (row){ row.name = c.name; row.follow = c.follow; row.status = c.status; row.facs = c.grid.factories.map(x => x.name).join(", "); }
  } catch(e){
    if (e.status === 412){ S.conflict = true; setSaveState("err","Changed elsewhere"); renderAll(); return; }
    if (e.status === 400){
      setSaveState("err","Save failed — finding the column…");
      const bad = await probeFields(url, fields);
      S.saveErr = bad.length ? "SharePoint rejected the " + bad.join(", ") + " column" + (bad.length > 1 ? "s" : "") +
        (bad.indexOf(S.cols.GridJson) >= 0 ? " — factories, styles and prices on this sheet are NOT saved. Check the GridJson column type (Multiple lines of text, Plain text)." : ".")
        : "SharePoint returned 400 and no single column reproduced it.";
      setSaveState("err", "Not saved — see the red banner");
      renderAll();
      console.error("400 on save. Payload:", fields, e.raw);
      return;
    }
    S.saveErr = e.message || "Unknown error"; setSaveState("err","Not saved — see the red banner"); renderAll(); console.error(e);
  }
}
/* Graph answers a bad field with a bare "Invalid request". Re-send one field at a
   time so the offending column is named in the UI instead of guessed at. */
async function probeFields(url, fields){
  const bad = [];
  for (const k of Object.keys(fields)){
    const one = {}; one[k] = fields[k];
    try { await gf(url, { method:"PATCH", body:JSON.stringify(one) }); }
    catch(e){ if (e.status === 400) bad.push(k); }
  }
  return bad;
}
async function refreshEtag(){
  try {
    const it = await gf("/sites/" + S.siteId + "/lists/" + listId(CFG.listSheets) + "/items/" + S.cur.id + "?$select=id,eTag");
    S.curEtag = (it && (it.eTag || it["@odata.etag"])) || null;
  } catch(e){ S.curEtag = null; }
}

/* ============================== OPEN ================================ */
async function openSheet(id){

/* ---------- landing ---------- */
function renderList(){
  const d = $("#detail");
  d.innerHTML = "";
  const q = S.q.toLowerCase().trim();
  const rows = S.sheets.filter(sh =>
    (S.filter === "All" || (S.filter === "Archived" ? sh.status === "Archived" : sh.status !== "Archived")) &&
    (!q || (sh.name + " " + sh.desc + " " + sh.facs).toLowerCase().indexOf(q) >= 0));
  if (S.gridColProblem) d.appendChild(gridColBanner());
  const card = el("div","card qlist"); d.appendChild(card);
  if (!rows.length){
    card.appendChild(el("div","empty", S.filter === "Archived" ? "No archived quote sheets." : "No quote sheets here — create one with + New quote sheet, or import a quote or comparison sheet."));
    return;
  }
  if (S.filter === "Open"){ rows.forEach(sh => card.appendChild(sheetCard(sh))); return; }
  // Archived / All: Year → Month folders from the sheet name (S26 → September 2026)
  const years = {};
  rows.forEach(sh => {
    const p = parseSheet(sh.name);
    const y = p && p.month != null ? String(p.year) : "Other", mk = p && p.month != null ? p.key : "other";
    const ml = p && p.month != null ? MONTHS[p.month] : "Unrecognized names";
    const Y = years[y] = years[y] || { months:{} };
    (Y.months[mk] = Y.months[mk] || { label:ml, items:[] }).items.push(sh);
  });
  const yKeys = Object.keys(years).sort((a,b) => a === "Other" ? 1 : b === "Other" ? -1 : b.localeCompare(a));
  if (!S.folds){
    S.folds = new Set();
    if (yKeys[0]){ S.folds.add("Y" + yKeys[0]); const m0 = Object.keys(years[yKeys[0]].months).sort().reverse()[0]; S.folds.add("M" + m0); }
  }
  const fold = (key, cls, label, count) => {
    const open = S.folds.has(key);
    const h = el("div", "month-hd fold " + cls + (open ? " open" : ""));
    h.appendChild(el("span","car","▸")); h.appendChild(el("span",null,label)); h.appendChild(el("span","ct",String(count)));
    h.onclick = () => { if (S.folds.has(key)) S.folds.delete(key); else S.folds.add(key); renderAll(); };
    card.appendChild(h); return open;
  };
  yKeys.forEach(y => {
    const Y = years[y], mKeys = Object.keys(Y.months).sort().reverse();
    const total = mKeys.reduce((a,k) => a + Y.months[k].items.length, 0);
    if (!fold("Y" + y, "yr", y, total)) return;
    mKeys.forEach(mk => {
      const M = Y.months[mk];
      if (!fold("M" + mk, "mo", M.label + (y !== "Other" ? " " + y : ""), M.items.length)) return;
      M.items.forEach(sh => card.appendChild(sheetCard(sh)));
    });
  });
}

/* What the follow-up is actually for: the factory with the earliest follow-up
   among those still mid-flow, and the step it's stuck before. */
function followWhat(g){
  const open = g.factories.filter(f => facDoneCount(f) < g.steps.length && f.follow)
    .sort((a,b) => a.follow < b.follow ? -1 : 1);
  if (open.length){
    const f = open[0], k = facDoneCount(f);
    return f.name + " — waiting on " + g.steps[k] + (open.length > 1 ? " · +" + (open.length - 1) + " more factor" + (open.length === 2 ? "y" : "ies") : "");

  const st = sheetStats(g);
  if (st.nPending) return st.nPending + " item" + (st.nPending === 1 ? "" : "s") + " pending award";
  if (st.needTrack) return st.needTrack + " sample" + (st.needTrack === 1 ? "" : "s") + " need tracking";

/* ---------- compare (read-only) ---------- */
function facSummary(g, f){
  let priced = 0, won = 0, wonVal = 0, quotedVal = 0, req = 0, rec = 0;
  g.styles.forEach(s => {
    const c = s.cells[f.id] || {}, p = numOf(c.price), q = numOf(s.qty);
    if (String(c.price || "").trim()) priced++;
    if (!isNaN(p) && !isNaN(q)) quotedVal += p * q;
    if (s.winner === f.id){ won++; if (!isNaN(p) && !isNaN(q)) wonVal += p * q; }
    if (c.sample && c.sample.req){ req++; if (c.sample.rec) rec++; }
  });
  const k = facDoneCount(f);

const md = iso => { const p = String(iso || "").slice(0,10).split("-"); return p.length === 3 ? Number(p[1]) + "/" + Number(p[2]) : ""; };
function sampleText(sm){

const CARRIERS = ["UPS","FedEx","DHL","USPS","Other"];
function detectCarrier(t){
  t = String(t || "").replace(/\s+/g, "");
  if (/^1Z[0-9A-Z]{16}$/i.test(t)) return "UPS";
  if (/^9\d{19,21}$/.test(t)) return "USPS";
  if (/^\d{10}$/.test(t)) return "DHL";
  if (/^(\d{12}|\d{15}|\d{20})$/.test(t)) return "FedEx";
  return "";
}
function trackUrl(carrier, t){
  t = encodeURIComponent(String(t || "").replace(/\s+/g, ""));
  if (!t) return "";
  return carrier === "UPS" ? "https://www.ups.com/track?tracknum=" + t
       : carrier === "FedEx" ? "https://www.fedex.com/fedextrack/?trknbr=" + t
       : carrier === "DHL" ? "https://www.dhl.com/us-en/home/tracking/tracking-express.html?tracking-id=" + t
       : carrier === "USPS" ? "https://tools.usps.com/go/TrackConfirmAction?tLabels=" + t : "";
}

/* ---------- quote images — same store as Quote Tracker ----------

   KEY = style uppercased, stripped to [A-Z0-9_-]. Fetched by key via $batch

function photoNode(style, readOnly){
