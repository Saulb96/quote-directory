<!DOCTYPE html>
<!--
================================================================================
M1S QUOTE DIRECTORY  —  saulb96.github.io/quote-directory/
Owner: Saul Braha, COO Metro1 Solutions. Single-file SPA, no build step.
================================================================================

WHAT IT IS
  Per-quote-sheet workspace. Header (name / follow-up date / attachments),
  a factory x step status matrix, and a style grid with per-factory MOQ+Price.

STORAGE  (option 2 — single list, JSON blob)
  List: Quote_Sheets  (named for the records it holds — one row per quote sheet.
         Deliberately NOT "Quote_Directory", which would collide in conversation
         with the Quote Directory workbook sheet feeding the Quoting Report.)
    Title         Single line of text   quote sheet name
    FollowUpDate  Date and Time (Date Only)
    FactoriesCsv  Single line of text   derived, comma-joined, for search
    FurthestStep  Number (0 decimals)   derived, max completed step count
    SheetStatus   Choice                Active | Archived   (default Active)
    GridJson      Multiple lines, PLAIN TEXT, no versioning
  NOTE: column names are single-word on purpose. Spaces mangle to _x0020_ and
  internal names are permanent. Do not rename after creation.

  GridJson shape (v1):
    { v:1,
      steps:     ["Factory Sent","Confirmed","Approved"],
      factories: [{ id, name, notes, steps:[{at,by}|null, ...] }],
      styles:    [{ id, style, desc, cells:{ <factoryId>:{moq,price} } }] }

  Concurrency: whole-blob PATCH guarded by If-Match on the item ETag. A 412
  raises a non-blocking "changed elsewhere" banner instead of silently losing
  the other person's edits. Last writer still wins if they reload and re-save.

LOOKUPS
  Steps      Quote_Lookups where LookupType0 = 'QuoteStep', ordered by SortOrder,
             Title = label. Falls back to STEP_FALLBACK if the read fails.
             Rename or add a step by adding a row — no redeploy.
  Factories  Factories list, Title column. Strict dropdown, no free text.

ATTACHMENTS
  Document library ATTACH_LIBRARY, one folder per item id. <=4MB simple PUT,
  larger uses createUploadSession + chunked PUT.

PHOTOS
  One folder per Style # under PHOTO_CFG.library. Graph $batch, 20 keys per
  batch, 3 batches in flight — same shape as Quote Tracker.
  >>> PHOTO_CFG.library is the one value to confirm before first run. If it
  >>> does not resolve the grid degrades to placeholders, it does not break.

RULES ENCODED
  - Steps are sequential. Step N is clickable only when N-1 is done.
  - A ticked step cannot be un-ticked. Holders of the QuoteAdmin app role get
    an unlock on the LAST completed step only, so the run stays contiguous.
  - Ticking sets FollowUpDate = tick date + 1 CALENDAR day. Manual edits are
    allowed but the next tick overwrites them.
  - A factory with any ticked step can only be removed by QuoteAdmin.
  - Autosave, 800ms debounce. No save button, no confirm dialogs.

ENTRA
  Own single-tenant SPA registration. Platform MUST be SPA, not Web — Web
  triggers CORS on GitHub Pages. Redirect URI = origin + pathname.
  Delegated scopes: User.Read, Sites.ReadWrite.All
  App role: QuoteAdmin (value), allowed member type Users/Groups.
  Assignment required = NO — anyone with access to /sites/Production can use
  the tool. Delegated calls run as the signed-in user, so SharePoint permissions
  on the Production site are the real gate. A user without site access signs in
  successfully and then gets the "no access" message below.

FIRST-RUN CHECKS
  1. Follow-up date lands on the next calendar day after a tick, not the next
     business day, and survives a reload.
  2. Style grid column groups line up with the factory rows after you add a
     factory mid-session — both grids read the same factory array.
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote Directory · M1S</title>
<link rel="preconnect" href="https://alcdn.msauth.net">
<style>
:root{
  --ink:#16202c; --muted:#5f6c7d; --glass:rgba(255,255,255,.62);
  --line:rgba(22,32,44,.10); --line2:rgba(22,32,44,.06);
  --accent:#3b6ea5; --accent-soft:rgba(59,110,165,.12);
  --good:#3f7d58; --good-soft:rgba(63,125,88,.14);
  --warn:#a5713b; --warn-soft:rgba(165,113,59,.14);
  --bad:#a5443b;
  --r:16px; --r-sm:10px;
  --blur:blur(18px) saturate(1.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink);
  font:14px/1.45 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 52%,#eaf6f1 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
#flow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ---------- chrome ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{font-weight:650;letter-spacing:.2px}
.brand span{color:var(--muted);font-weight:400;margin-left:8px;font-size:12.5px}
.spacer{flex:1}
.who{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.pill{
  font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.3px;
}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  border:1px solid var(--line);background:rgba(255,255,255,.55);
  padding:6px 12px;border-radius:var(--r-sm);transition:background .15s,border-color .15s;
}
.btn:hover{background:rgba(255,255,255,.85);border-color:rgba(22,32,44,.18)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#33608f}
.btn.sm{padding:3px 9px;font-size:12.5px}
.icon{
  border:none;background:none;padding:4px;border-radius:8px;color:var(--muted);
  line-height:0;transition:background .15s,color .15s;
}
.icon:hover{background:rgba(22,32,44,.07);color:var(--ink)}

/* ---------- layout ---------- */
.body{flex:1;display:flex;min-height:0}
.rail{
  width:280px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0;
  background:rgba(255,255,255,.42);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-right:1px solid var(--line);
}
.rail-top{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line2)}
.rail-list{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:5px}
.sheet-item{
  padding:9px 11px;border-radius:var(--r-sm);border:1px solid transparent;
  background:rgba(255,255,255,.5);cursor:pointer;transition:background .15s,border-color .15s;
}
.sheet-item:hover{background:rgba(255,255,255,.85)}
.sheet-item.on{background:#fff;border-color:var(--accent);box-shadow:0 1px 6px rgba(22,32,44,.07)}
.sheet-item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-item .sub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.due{background:var(--warn)}
.dot.late{background:var(--bad)}
.main{flex:1;overflow:auto;padding:20px;min-width:0}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ---------- cards ---------- */
.card{
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 2px 14px rgba(22,32,44,.05);
}
.card-hd{
  padding:11px 16px;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:10px;
}
.card-hd h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.35px;text-transform:uppercase;color:var(--muted)}
.card-bd{padding:14px 16px}
.card-bd.flush{padding:0}

input,select,textarea{
  font:inherit;color:var(--ink);background:rgba(255,255,255,.75);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;width:100%;
  transition:border-color .15s,background .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff}
input[readonly]{background:rgba(255,255,255,.4);color:var(--muted)}
label.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
label.fld > span{font-size:11px;font-weight:600;letter-spacing:.35px;text-transform:uppercase;color:var(--muted)}

/* ---------- header card ---------- */
.hdr-grid{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.hdr-grid .nm-f{flex:1 1 320px}
.hdr-grid .dt-f{flex:0 0 180px}
.hdr-grid input.nm{font-size:17px;font-weight:650;padding:8px 11px}
.clip{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:rgba(255,255,255,.55);padding:7px 12px;border-radius:var(--r-sm);
}
.clip:hover{background:rgba(255,255,255,.9)}
.files{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.file{
  display:flex;align-items:center;gap:7px;font-size:12.5px;
  background:rgba(255,255,255,.7);border:1px solid var(--line);
  padding:4px 5px 4px 10px;border-radius:999px;max-width:280px;
}
.file a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file a:hover{text-decoration:underline}
.file .sz{color:var(--muted);font-size:11px;flex:0 0 auto}

/* ---------- tables ---------- */
.tbl-scroll{overflow:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle}
thead th{
  font-size:11px;font-weight:650;letter-spacing:.35px;text-transform:uppercase;color:var(--muted);
  background:rgba(255,255,255,.5);position:sticky;top:0;z-index:2;white-space:nowrap;
}
thead tr:first-child th{border-bottom:1px solid var(--line2)}
tbody tr:hover{background:rgba(255,255,255,.45)}
tbody tr:last-child td{border-bottom:none}
th.grp{text-align:center;border-left:1px solid var(--line);background:rgba(255,255,255,.62)}
td.grp-l{border-left:1px solid var(--line)}
.fac-nm{font-weight:600;white-space:nowrap}
.num{text-align:right}
.num input{text-align:right}
td input,td select,td textarea{padding:4px 7px;font-size:13px}
td textarea{resize:vertical;min-height:30px;line-height:1.35}
.w-sty{min-width:150px}
.w-desc{min-width:200px}
.w-cell{min-width:92px}
.w-notes{min-width:200px}

/* ---------- step cells ---------- */
.step-c{text-align:center;width:132px}
.tick{
  width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(22,32,44,.28);
  background:rgba(255,255,255,.7);display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s,transform .1s;
}
.tick:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);transform:scale(1.07)}
.tick:disabled{opacity:.32;cursor:not-allowed}
.done{
  display:inline-flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--good-soft);color:var(--good);border-radius:8px;padding:3px 9px;
  font-size:11px;font-weight:600;line-height:1.25;position:relative;
}
.done .by{font-weight:400;opacity:.8;font-size:10.5px}
.done .undo{
  position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:1px solid var(--line);color:var(--muted);font-size:10px;
  display:none;align-items:center;justify-content:center;padding:0;line-height:1;
}
.done.unlockable:hover .undo{display:flex}
.done .undo:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- photos ---------- */
.ph{
  width:52px;height:52px;border-radius:8px;overflow:hidden;flex:0 0 auto;
  background:rgba(22,32,44,.05);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.load{
  background:linear-gradient(100deg,rgba(22,32,44,.05) 30%,rgba(255,255,255,.7) 50%,rgba(22,32,44,.05) 70%);
  background-size:220% 100%;animation:shim 1.3s linear infinite;
}
@keyframes shim{to{background-position:-220% 0}}
.ph .none{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.15;padding:2px}

/* ---------- misc ---------- */
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.inline-load{display:flex;align-items:center;gap:9px;padding:16px;color:var(--muted);font-size:12.5px}
.spin{
  width:15px;height:15px;border:2px solid var(--accent-soft);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto;
}
@keyframes sp{to{transform:rotate(360deg)}}
.save{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:80px}
.save.err{color:var(--bad);font-weight:600}
.banner{
  display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:var(--r-sm);
  background:var(--warn-soft);border:1px solid rgba(165,113,59,.3);color:var(--warn);font-size:13px;
}
.banner.bad{background:rgba(165,68,59,.12);border-color:rgba(165,68,59,.3);color:var(--bad)}
.row-x{opacity:0;transition:opacity .15s}
tr:hover .row-x{opacity:1}
.add-bar{padding:9px 14px;border-top:1px solid var(--line2);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--muted)}
dialog{
  border:1px solid var(--line);border-radius:var(--r);padding:0;max-width:460px;width:92vw;
  background:rgba(255,255,255,.92);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:0 12px 40px rgba(22,32,44,.2);color:var(--ink);
}
dialog::backdrop{background:rgba(22,32,44,.28);backdrop-filter:blur(3px)}
.dlg-bd{padding:18px;display:flex;flex-direction:column;gap:13px}
.dlg-ft{display:flex;justify-content:flex-end;gap:9px}
.gate{
  position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 52%,#eaf6f1 100%);
}
.gate .card{padding:34px 40px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #flow{display:none}
}
</style>
</head>
<body>
<canvas id="flow"></canvas>

<div class="gate" id="gate">
  <div class="card">
    <div>
      <div style="font-size:19px;font-weight:650">Quote Directory</div>
      <div style="color:var(--muted);font-size:12.5px;margin-top:5px">Metro1 Solutions</div>
    </div>
    <div id="gateMsg" class="inline-load"><div class="spin"></div>Checking your session…</div>

<div id="app" style="display:none">

    <div class="save" id="saveState"></div>

  <div class="body">

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script>
"use strict";

/* ============================== CONFIG ============================== */
const CFG = {
  clientId : "70f97ec1-89f5-43cf-bb49-b28e794c1386",
  tenantId : "eeea7e3e-9ccb-4a16-894e-3417c6a7a4c1",
  host     : "met1sol.sharepoint.com",
  sitePath : "/sites/Production",
  scopes   : ["User.Read", "Sites.ReadWrite.All"],
  adminRole: "QuoteAdmin",

  listSheets    : "Quote_Sheets",
  listLookups   : "Quote_Lookups",
  listFactories : "Factories",

  attachLibrary : "Quote Sheet Files",

  // >>> CONFIRM: library holding one folder per Style #, same source Quote Tracker uses.
  photoLibrary  : "Style Photos"
};
const STEP_FALLBACK = ["Factory Sent", "Confirmed", "Approved"];
const G = "https://graph.microsoft.com/v1.0";

/* ============================== STATE =============================== */
const S = {
  acct:null, admin:false,
  siteId:null, lists:{}, driveAttach:null, drivePhoto:null,
  steps:STEP_FALLBACK.slice(), factoryNames:[],
  sheets:[], cur:null, curEtag:null, dirty:false, saveTimer:null, conflict:false,
  photos:new Map()
};

/* ============================== MSAL ================================ */
const redirectUri = window.location.origin + window.location.pathname;
const msalApp = new msal.PublicClientApplication({
  auth:{ clientId:CFG.clientId, authority:"https://login.microsoftonline.com/"+CFG.tenantId, redirectUri },
  cache:{ cacheLocation:"localStorage", storeAuthStateInCookie:false }
});
const framed = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();

async function getToken(){
  const r = await msalApp.acquireTokenSilent({ scopes:CFG.scopes, account:S.acct })
    .catch(async () => framed
      ? msalApp.acquireTokenPopup({ scopes:CFG.scopes })
      : (msalApp.acquireTokenRedirect({ scopes:CFG.scopes }), new Promise(()=>{})));
  return r.accessToken;
}

/* ============================== GRAPH =============================== */
async function gf(path, opts){
  opts = opts || {};
  const tok = await getToken();
  const h = Object.assign({ Authorization:"Bearer "+tok }, opts.headers || {});
  if (opts.body && !(opts.body instanceof ArrayBuffer) && !h["Content-Type"]) h["Content-Type"] = "application/json";
  const url = /^https?:/.test(path) ? path : G + path;
  const res = await fetch(url, { method:opts.method || "GET", headers:h, body:opts.body });
  if (res.status === 429 || res.status === 503){
    const wait = (parseInt(res.headers.get("Retry-After") || "3", 10)) * 1000;
    await new Promise(r => setTimeout(r, wait));
    return gf(path, opts);
  }
  if (!res.ok){
    const txt = await res.text().catch(()=> "");
    const err = new Error("Graph " + res.status + " " + path + " " + txt.slice(0,300));
    err.status = res.status;
    throw err;
  }
  if (res.status === 204 || res.status === 202) return null;
  const ct = res.headers.get("Content-Type") || "";
  return ct.indexOf("json") >= 0 ? res.json() : null;
}
async function gAll(path){
  const out = [];
  let next = path;
  while (next){
    const p = await gf(next);
    if (p && p.value) out.push.apply(out, p.value);
    next = p && p["@odata.nextLink"] ? p["@odata.nextLink"] : null;
  }
  return out;
}

/* ============================== BOOT ================================ */
async function resolveSite(){
  const s = await gf("/sites/" + CFG.host + ":" + CFG.sitePath);
  S.siteId = s.id;

  const lists = await gAll("/sites/" + S.siteId + "/lists?$select=id,name,displayName&$top=200");
  lists.forEach(l => { S.lists[l.name] = l.id; S.lists[l.displayName] = l.id; });

  const drives = await gAll("/sites/" + S.siteId + "/drives?$select=id,name");
  const pick = n => { const d = drives.find(x => x.name === n); return d ? d.id : null; };
  S.driveAttach = pick(CFG.attachLibrary);
  S.drivePhoto  = pick(CFG.photoLibrary);
}
async function loadLookups(){
  try {
    const rows = await gAll("/sites/" + S.siteId + "/lists/" + S.lists[CFG.listLookups] +
      "/items?expand=fields(select=Title,LookupType0,SortOrder)&$top=500");
    const steps = rows
      .map(r => r.fields || {})
      .filter(f => String(f.LookupType0 || "") === "QuoteStep")
      .sort((a,b) => (Number(a.SortOrder)||0) - (Number(b.SortOrder)||0))
      .map(f => String(f.Title || "").trim())
      .filter(Boolean);
    if (steps.length) S.steps = steps;
  } catch(e){ console.warn("Step lookup failed, using fallback.", e); }

  try {
    const rows = await gAll("/sites/" + S.siteId + "/lists/" + S.lists[CFG.listFactories] +
      "/items?expand=fields(select=Title)&$top=1000");
    S.factoryNames = rows.map(r => String((r.fields||{}).Title || "").trim())
      .filter(Boolean).sort((a,b) => a.localeCompare(b));
  } catch(e){ console.warn("Factory list failed.", e); }
}
async function loadSheets(){
  const rows = await gAll("/sites/" + S.siteId + "/lists/" + S.lists[CFG.listSheets] +
    "/items?expand=fields(select=Title,FollowUpDate,FactoriesCsv,FurthestStep,SheetStatus)" +
    "&$orderby=fields/FollowUpDate asc&$top=500");
  S.sheets = rows.map(r => ({
    id:r.id,
    name:(r.fields||{}).Title || "(untitled)",
    follow:(r.fields||{}).FollowUpDate || null,
    facs:(r.fields||{}).FactoriesCsv || "",
    step:Number((r.fields||{}).FurthestStep) || 0,
    status:(r.fields||{}).SheetStatus || "Active"
  }));
  renderRail();
}

/* ============================== UTIL ================================ */
const $  = s => document.querySelector(s);
const el = (t,c,x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = () => Math.random().toString(36).slice(2,9);

function dayKey(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function nextCalendarDay(from){
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate() + 1);
  return dayKey(d);
}
function fmtDay(iso){
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return (d.getUTCMonth()+1) + "/" + d.getUTCDate() + "/" + String(d.getUTCFullYear()).slice(2);
}
function fmtStamp(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "";
  let h = d.getHours(); const ap = h >= 12 ? "p" : "a"; h = h % 12 || 12;
  return (d.getMonth()+1) + "/" + d.getDate() + "/" + String(d.getFullYear()).slice(2) +
         " " + h + ":" + String(d.getMinutes()).padStart(2,"0") + ap;
}
function fmtSize(b){
  if (b == null) return "";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(0) + " KB";
  return (b/1048576).toFixed(1) + " MB";
}
function blankGrid(){
  return { v:1, steps:S.steps.slice(), factories:[], styles:[] };
}
function normalize(g){
  g = g && typeof g === "object" ? g : {};
  g.v = 1;
  g.steps = Array.isArray(g.steps) && g.steps.length ? g.steps : S.steps.slice();
  g.factories = Array.isArray(g.factories) ? g.factories : [];
  g.styles = Array.isArray(g.styles) ? g.styles : [];
  const n = g.steps.length;
  g.factories.forEach(f => {
    f.id = f.id || uid();
    f.name = f.name || "";
    f.notes = f.notes || "";
    f.steps = Array.isArray(f.steps) ? f.steps : [];
    while (f.steps.length < n) f.steps.push(null);
    f.steps.length = n;
  });
  g.styles.forEach(s => {
    s.id = s.id || uid();
    s.style = s.style || "";
    s.desc = s.desc || "";
    s.cells = s.cells && typeof s.cells === "object" ? s.cells : {};
    g.factories.forEach(f => { if (!s.cells[f.id]) s.cells[f.id] = { moq:"", price:"" }; });
  });
  return g;
}
function furthest(g){
  let m = 0;
  g.factories.forEach(f => {
    let c = 0;
    for (let i = 0; i < f.steps.length; i++){ if (f.steps[i]) c++; else break; }
    if (c > m) m = c;
  });
  return m;
}

/* ============================== SAVE ================================ */
function setSaveState(kind, msg){
  const n = $("#saveState");
  n.className = "save" + (kind === "err" ? " err" : "");
  n.innerHTML = "";
  if (kind === "saving"){ n.appendChild(el("div","spin")); n.appendChild(el("span",null,"Saving…")); }
  else if (kind === "saved") n.appendChild(el("span",null,"Saved " + fmtStamp(new Date().toISOString())));
  else if (kind === "err") n.appendChild(el("span",null, msg || "Save failed"));
}
function touch(){
  if (!S.cur || S.conflict) return;
  S.dirty = true;
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(save, 800);
}
async function save(){
  if (!S.cur || !S.dirty || S.conflict) return;
  const c = S.cur;
  setSaveState("saving");
  const fields = {
    Title: c.name || "(untitled)",
    FollowUpDate: c.follow ? c.follow + "T00:00:00Z" : null,
    FactoriesCsv: c.grid.factories.map(f => f.name).filter(Boolean).join(", "),
    FurthestStep: furthest(c.grid),
    SheetStatus: c.status || "Active",
    GridJson: JSON.stringify(c.grid)
  };
  try {
    const r = await gf("/sites/" + S.siteId + "/lists/" + S.lists[CFG.listSheets] + "/items/" + c.id + "/fields", {
      method:"PATCH",
      headers:{ "If-Match": S.curEtag || "*" },
      body:JSON.stringify(fields)
    });
    S.dirty = false;
    setSaveState("saved");
    if (r && r["@odata.etag"]) S.curEtag = r["@odata.etag"];
    else await refreshEtag();
    const row = S.sheets.find(s => s.id === c.id);
    if (row){
      row.name = fields.Title; row.follow = c.follow;
      row.facs = fields.FactoriesCsv; row.step = fields.FurthestStep; row.status = fields.SheetStatus;
      renderRail();
    }
  } catch(e){
    if (e.status === 412){ S.conflict = true; setSaveState("err","Changed elsewhere"); renderDetail(); }
    else { setSaveState("err", "Save failed — " + (e.message || "")); console.error(e); }
  }
}
async function refreshEtag(){
  try {
    const it = await gf("/sites/" + S.siteId + "/lists/" + S.lists[CFG.listSheets] + "/items/" + S.cur.id + "?$select=id,eTag");
    S.curEtag = it && (it.eTag || it["@odata.etag"]) || null;
  } catch(e){ S.curEtag = null; }
}

/* ============================== RAIL ================================ */
function renderRail(){
  const q = ($("#search").value || "").toLowerCase().trim();
  const arch = $("#showArch").checked;
  const list = $("#railList");
  list.innerHTML = "";
  const today = dayKey(new Date());
  const rows = S.sheets.filter(s =>
    (arch || s.status !== "Archived") &&
    (!q || (s.name + " " + s.facs).toLowerCase().indexOf(q) >= 0)
  );
  if (!rows.length){ list.appendChild(el("div","empty","Nothing here.")); return; }
  rows.forEach(s => {
    const n = el("div","sheet-item" + (S.cur && S.cur.id === s.id ? " on" : ""));
    n.appendChild(el("div","nm",s.name));
    const sub = el("div","sub");
    const day = s.follow ? s.follow.slice(0,10) : null;
    const dot = el("span","dot" + (day && day < today ? " late" : day === today ? " due" : ""));
    sub.appendChild(dot);
    sub.appendChild(el("span",null,"Follow up " + fmtDay(s.follow)));

async function openSheet(id){

  const d = $("#detail");
  d.innerHTML = "";
  const c = el("div","card"); c.innerHTML = '<div class="inline-load"><div class="spin"></div>Opening quote sheet…</div>';
  d.appendChild(c);

  const it = await gf("/sites/" + S.siteId + "/lists/" + S.lists[CFG.listSheets] + "/items/" + id +
    "?expand=fields(select=Title,FollowUpDate,FactoriesCsv,FurthestStep,SheetStatus,GridJson)");
  const f = it.fields || {};
  let grid;
  try { grid = JSON.parse(f.GridJson || "null") || blankGrid(); }
  catch(e){ grid = blankGrid(); console.warn("GridJson unparseable, starting fresh for item " + id); }

  S.cur = {
    id:id,
    name:f.Title || "",
    follow:f.FollowUpDate ? f.FollowUpDate.slice(0,10) : "",
    status:f.SheetStatus || "Active",
    grid:normalize(grid),

  renderDetail();

}

function isLastDone(f, i){
  if (!f.steps[i]) return false;
  for (let j = i + 1; j < f.steps.length; j++) if (f.steps[j]) return false;

}
function tickStep(f, i){
  if (f.steps[i]) return;
  if (i > 0 && !f.steps[i-1]) return;
  const now = new Date();

  touch();
  renderDetail();
}
function addFactory(name){

  touch(); renderDetail();
}
function removeFactory(id){
  const g = S.cur.grid;
  g.factories = g.factories.filter(f => f.id !== id);
  g.styles.forEach(s => { delete s.cells[id]; });
  touch(); renderDetail();
}

/* ---------- photos ---------- */
function photoNode(style){
  const key = String(style || "").trim();
  const n = el("div","ph");
  if (!key){ n.appendChild(el("span","none","—")); return n; }
  const hit = S.photos.get(key);
  if (hit === undefined){ n.classList.add("load"); n.dataset.key = key; return n; }
  if (hit === null){ n.appendChild(el("span","none","no photo")); return n; }
  const img = document.createElement("img");
  img.src = hit; img.alt = key; img.loading = "lazy";
  n.appendChild(img);
  return n;
}
async function loadPhotos(){
  if (!S.cur) return;
  if (!S.drivePhoto){
    S.cur.grid.styles.forEach(s => { const k = String(s.style||"").trim(); if (k && !S.photos.has(k)) S.photos.set(k, null); });
    renderDetail(); return;
  }
  const keys = [];
  const seen = new Set();
  S.cur.grid.styles.forEach(s => {
    const k = String(s.style || "").trim();
    if (k && !seen.has(k) && !S.photos.has(k)){ seen.add(k); keys.push(k); }
  });
  if (!keys.length) return;

  const batches = [];
  for (let i = 0; i < keys.length; i += 20) batches.push(keys.slice(i, i + 20));

  let idx = 0;
  const worker = async () => {
    while (idx < batches.length){
      const b = batches[idx++];
      const requests = b.map((k, i) => ({
        id:String(i),
        method:"GET",
        url:"/drives/" + S.drivePhoto + "/root:/" + encodeURIComponent(k) +
            ":/children?$select=name,file,@microsoft.graph.downloadUrl&$top=20"
      }));
      try {
        const res = await gf("/$batch", { method:"POST", body:JSON.stringify({ requests:requests }) });
        (res.responses || []).forEach(r => {
          const key = b[Number(r.id)];
          let url = null;
          if (r.status === 200 && r.body && r.body.value){
            const img = r.body.value.find(x => x.file && /\.(jpe?g|png|gif|webp|bmp)$/i.test(x.name || ""));
            if (img) url = img["@microsoft.graph.downloadUrl"] || null;
          }
          S.photos.set(key, url);
        });
      } catch(e){
        b.forEach(k => S.photos.set(k, null));
        console.warn("Photo batch failed", e);
      }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if (S.cur) renderDetail();
}

  box.innerHTML = ""; box.appendChild(el("span","hint","Uploading…"));
  try {
    await ensureFolder();
    for (const file of list){
      const dest = "/drives/" + S.driveAttach + "/root:" + folderPath() + "/" + encodeURIComponent(file.name);
      if (file.size <= 4 * 1024 * 1024){
        const buf = await file.arrayBuffer();
        await gf(dest + ":/content", { method:"PUT", headers:{ "Content-Type":"application/octet-stream" }, body:buf });
      } else {
        const sess = await gf(dest + ":/createUploadSession", {
          method:"POST",
          body:JSON.stringify({ item:{ "@microsoft.graph.conflictBehavior":"replace" } })
        });
        const CH = 5 * 327680 * 2; // ~3.2 MB, multiple of 320 KiB
        for (let start = 0; start < file.size; start += CH){
          const end = Math.min(start + CH, file.size);
          const chunk = await file.slice(start, end).arrayBuffer();
          const tok = await getToken();
          const r = await fetch(sess.uploadUrl, {
            method:"PUT",
            headers:{
              Authorization:"Bearer " + tok,
              "Content-Length":String(end - start),
              "Content-Range":"bytes " + start + "-" + (end-1) + "/" + file.size
            },
            body:chunk
          });
          if (!r.ok && r.status !== 202) throw new Error("Chunk upload failed " + r.status);
        }
      }
    }
  } catch(e){ console.error(e); }
  await loadFiles();
}

/* ---------- new sheet ---------- */
async function createSheet(name){
  const body = { fields:{ Title:name, SheetStatus:"Active", FollowUpDate:dayKey(new Date()) + "T00:00:00Z", FactoriesCsv:"", FurthestStep:0, GridJson:JSON.stringify(blankGrid()) } };
  const it = await gf("/sites/" + S.siteId + "/lists/" + S.lists[CFG.listSheets] + "/items", { method:"POST", body:JSON.stringify(body) });
  await loadSheets();
  openSheet(it.id);
}

/* ============================== CANVAS ============================== */
function flowField(){
  const cv = $("#flow"), ctx = cv.getContext("2d");
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W, H;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); addEventListener("resize", resize);

  let seed = 20260610;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const P = [];
  for (let i = 0; i < 70; i++) P.push({ x:rnd()*W, y:rnd()*H, o:rnd()*Math.PI*2, s:.18 + rnd()*.34 });
  const noise = (x,y,t) => Math.sin(x*.0016 + t) + Math.cos(y*.0021 - t*.8) + Math.sin((x+y)*.0009 + t*.5);

  let t = 0;
  (function tick(){
    t += .0016;
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1;
    P.forEach(p => {
      const a = noise(p.x, p.y, t) * Math.PI;
      p.x += Math.cos(a) * p.s; p.y += Math.sin(a) * p.s;
      if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      ctx.strokeStyle = "rgba(59,110,165,.14)";
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - Math.cos(a)*7, p.y - Math.sin(a)*7);
      ctx.stroke();
    });
    requestAnimationFrame(tick);
  })();
}

/* ============================== INIT ================================ */
function gateMsg(html){ $("#gateMsg").innerHTML = html; }

async function start(){
  flowField();
  await msalApp.initialize();
  const rr = await msalApp.handleRedirectPromise().catch(e => { console.error(e); return null; });
  let acct = (rr && rr.account) || msalApp.getAllAccounts()[0];
  if (!acct){
    gateMsg("");
    $("#signIn").style.display = "";
    $("#signIn").onclick = () => framed
      ? msalApp.loginPopup({ scopes:CFG.scopes }).then(r => { S.acct = r.account; msalApp.setActiveAccount(r.account); boot(); })
      : msalApp.loginRedirect({ scopes:CFG.scopes });
    return;
  }
  S.acct = acct; msalApp.setActiveAccount(acct);
  boot();
}
async function boot(){
  try {
    gateMsg('<div class="spin"></div>Loading lists…');
    const claims = S.acct.idTokenClaims || {};
    S.admin = Array.isArray(claims.roles) && claims.roles.indexOf(CFG.adminRole) >= 0;
    await resolveSite();
    if (!S.lists[CFG.listSheets]) throw new Error('List "' + CFG.listSheets + '" not found on ' + CFG.sitePath);
    await loadLookups();
    await loadSheets();

    $("#whoName").textContent = S.acct.name || S.acct.username || "";
    $("#adminPill").style.display = S.admin ? "" : "none";
    $("#gate").style.display = "none";
    $("#app").style.display = "";
  } catch(e){
    console.error(e);
    const denied = e.status === 403 || e.status === 401 ||
                   (e.status === 404 && /\/sites\//.test(String(e.message||"")));
    gateMsg('<span style="color:var(--bad)">' + (denied
      ? "Signed in, but you don't have access to the Production site. Ask Saul or Judah to add you."
      : esc(e.message || "Startup failed")) + "</span>");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  $("#signOut").onclick = () => msalApp.logoutRedirect({ postLogoutRedirectUri: redirectUri });
  $("#search").oninput = renderRail;
  $("#showArch").onchange = renderRail;
  $("#newSheet").onclick = () => { $("#newName").value = ""; $("#newDlg").showModal(); $("#newName").focus(); };
  $("#newCancel").onclick = () => $("#newDlg").close();
  $("#newCreate").onclick = async () => {
    const n = ($("#newName").value || "").trim();
    if (!n) return;
    $("#newDlg").close();
    await createSheet(n);
  };
  $("#newName").addEventListener("keydown", e => { if (e.key === "Enter") $("#newCreate").click(); });
  $("#filePick").onchange = e => { if (e.target.files && e.target.files.length) uploadFiles(Array.from(e.target.files)); };
  window.addEventListener("beforeunload", e => { if (S.dirty){ e.preventDefault(); e.returnValue = ""; } });
  start();
});
