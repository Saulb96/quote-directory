let imgTarget = null;
function pickImage(style){ imgTarget = style; const i = $("#imgPick"); i.value = ""; i.click(); }
function resizeTo(file, max){
  return new Promise((ok, bad) => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    fr.onerror = () => bad(new Error("Cannot read file"));
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : bad(new Error("Encode failed")), "image/jpeg", max > 500 ? .86 : .82);
    };
    img.onerror = () => bad(new Error("Cannot decode this image (HEIC is not supported in Chrome)"));
    fr.readAsDataURL(file);
  });
}
async function uploadImage(style, file){
  const key = keyOf(style);
  if (!key || !S.drivePhoto) return false;
  let ok = true;
  S.photos.set(key, undefined); renderAll();
  try {
    for (const pair of [["thumb",360],["full",1400]]){
      const blob = await resizeTo(file, pair[1]);
      const tok = await getToken();
      const url = G + "/drives/" + S.drivePhoto + "/root:/" + encPath(CFG.imgPath) + "/" + pair[0] + "/" + encodeURIComponent(key) + ".jpg:/content";
      const r = await fetch(url, { method:"PUT", headers:{ Authorization:"Bearer " + tok, "Content-Type":"image/jpeg" }, body:blob });
      if (!r.ok) throw new Error("Upload " + pair[0] + " failed: " + r.status);
      const it = await r.json();
      if (pair[0] === "thumb") S.photos.set(key, it["@microsoft.graph.downloadUrl"] || null);
    }
  } catch(e){
    console.error(e); S.photos.set(key, null); ok = false;
    setSaveState("err","Quote image upload failed — " + (e.message || ""));
  }
  renderAll();
  return ok;
}
async function loadPhotos(){
  if (!S.cur) return;
  const keys = [], seen = new Set();
  S.cur.grid.styles.forEach(st => { const k = keyOf(st.style); if (k && !seen.has(k) && !S.photos.has(k)){ seen.add(k); keys.push(k); } });
  if (!keys.length){ return; }
  if (!S.drivePhoto){ keys.forEach(k => S.photos.set(k, null)); renderAll(); return; }
  const jobs = [];
  for (let i = 0; i < keys.length; i += 20) jobs.push(keys.slice(i, i + 20));
  let idx = 0;
  const worker = async () => {
    while (idx < jobs.length){
      const j = jobs[idx++];
      const requests = j.map((k,i) => ({ id:String(i+1), method:"GET",
        url:"/drives/" + S.drivePhoto + "/root:/" + encPath(CFG.imgPath) + "/thumb/" + encodeURIComponent(k) + ".jpg" }));
      try {
        const res = await gf("/$batch", { method:"POST", body:JSON.stringify({ requests:requests }) });
        (res.responses || []).forEach(r => { S.photos.set(j[Number(r.id)-1], (r.status === 200 && r.body && r.body["@microsoft.graph.downloadUrl"]) || null); });
      } catch(e){ j.forEach(k => S.photos.set(k, null)); console.warn("Thumb batch failed", e.message); }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if (S.cur) renderAll();
}


/* ---------- attachments ---------- */
function folderPath(){ return "/" + S.cur.id; }
async function loadFiles(){
  if (!S.cur) return;
  if (S.driveAttach){
    try {
      const r = await gf("/drives/" + S.driveAttach + "/root:" + folderPath() + ":/children?$select=name,size,webUrl&$top=200");
      S.cur.files = (r && r.value) || [];
    } catch(e){ S.cur.files = []; }
  }
  S.filesLoaded = true;
  if (S.cur.grid.nFiles !== S.cur.files.length){ S.cur.grid.nFiles = S.cur.files.length; touch(); }
  renderFiles();
}
function renderFiles(){
  const box = $("#fileList");
  if (!box || !S.cur) return;
  box.innerHTML = "";
  if (!S.driveAttach){ box.appendChild(el("span","hint warn",'Library "' + CFG.attachLibrary + '" not found on ' + CFG.sitePath + '.')); return; }
  if (!S.filesLoaded){ box.appendChild(el("span","hint","Loading files…")); return; }
  if (!S.cur.files.length){ box.appendChild(el("span","hint","No files attached.")); return; }
  S.cur.files.forEach(f => {
    const n = el("div","file");
    const a = document.createElement("a");
    a.href = f.webUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = f.name;
    n.appendChild(a);
    n.appendChild(el("span","sz",fmtSize(f.size)));
    const x = el("button","icon","✕");
    x.title = "Delete file";
    x.onclick = async () => {
      x.disabled = true;
      try {
        await gf("/drives/" + S.driveAttach + "/root:" + folderPath() + "/" + encodeURIComponent(f.name) + ":", { method:"DELETE" });
        S.cur.files = S.cur.files.filter(z => z.name !== f.name);
        renderFiles();
      } catch(e){ x.disabled = false; }
    };
    n.appendChild(x); box.appendChild(n);
  });
}
async function ensureFolder(){
  try { await gf("/drives/" + S.driveAttach + "/root:" + folderPath()); return; }
  catch(e){ if (e.status !== 404) throw e; }
  try {
    await gf("/drives/" + S.driveAttach + "/root/children", {
      method:"POST",
      body:JSON.stringify({ name:String(S.cur.id), folder:{}, "@microsoft.graph.conflictBehavior":"fail" })
    });
  } catch(e){ if (e.status !== 409) throw e; }   // 409 = created meanwhile — fine
}
/* Upload one file/blob into this sheet's attachment folder under `name`.
   <=4MB simple PUT, larger via upload session. Existing same-name files are replaced. */
async function putAttachment(name, blob){
  if (!S.cur || !S.driveAttach) throw new Error('Library "' + CFG.attachLibrary + '" not found');
  await ensureFolder();
  const size = blob.size, dest = "/drives/" + S.driveAttach + "/root:" + folderPath() + "/" + encodeURIComponent(name);
  if (size <= 4*1024*1024){
    await gf(dest + ":/content", { method:"PUT", headers:{ "Content-Type":"application/octet-stream" }, body:await blob.arrayBuffer() });
    return;
  }
  const sess = await gf(dest + ":/createUploadSession", { method:"POST", body:JSON.stringify({ item:{ "@microsoft.graph.conflictBehavior":"replace" } }) });
  const CH = 327680 * 10; // 3.2 MB, multiple of 320 KiB as Graph requires
  for (let start = 0; start < size; start += CH){
    const end = Math.min(start + CH, size);
    const r = await fetch(sess.uploadUrl, { method:"PUT",
      headers:{ Authorization:"Bearer " + (await getToken()), "Content-Range":"bytes " + start + "-" + (end-1) + "/" + size },
      body:await blob.slice(start, end).arrayBuffer() });
    if (!r.ok && r.status !== 202) throw new Error("Chunk upload failed " + r.status);
  }
}
async function uploadFiles(list){
  if (!S.cur || !S.driveAttach) return;
  S.filesLoaded = false;
  const box = $("#fileList");
  if (box){ box.innerHTML = ""; box.appendChild(el("span","hint","Uploading…")); }
  for (const file of list){ try { await putAttachment(file.name, file); } catch(e){ console.error(e); setSaveState("err","Upload failed — " + (e.message || "")); } }
  await loadFiles();
}

/* ---------- create ---------- */
async function createSheet(name, desc){
  const fields = {};
  const put = (k,v) => { if (S.cols[k]) fields[S.cols[k]] = v; };
  const g0 = blankGrid(); g0.desc = String(desc || "");
  put("Title", name);
  put("SheetStatus", "Active");
  put("FollowUpDate", dayKey(new Date()) + "T00:00:00Z");
  put("GridJson", JSON.stringify(g0));
  if (S.cols.FurthestStep) fields[S.cols.FurthestStep] = 0;
  const it = await gf("/sites/" + S.siteId + "/lists/" + listId(CFG.listSheets) + "/items",
    { method:"POST", body:JSON.stringify({ fields:fields }) });
  await loadSheets();
  await openSheet(it.id);
}

/* Deep link: ?sheet=AU26Q01 opens that sheet; if it only exists in Quote
   Tracker yet, it is created (and auto-synced). Quote Tracker's column L can
   link here as https://saulb96.github.io/quote-directory/?sheet=<name>. */
async function handleDeepLink(){
  const want = new URLSearchParams(location.search).get("sheet");
  if (!want) return;
  const norm = x => String(x || "").trim().toUpperCase();
  const hit = S.sheets.find(sh => norm(sh.name) === norm(want));
  if (hit){ openSheet(hit.id); return; }
  await loadTracker();
  const tn = S.trackerNames.find(n => norm(n) === norm(want));
  if (tn){ await createSheet(tn); return; }
}

/* ============================== CANVAS ============================== */
function flowField(){
  const cv = $("#flow"), ctx = cv.getContext("2d");
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W,H;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); addEventListener("resize", resize);
  let seed = 20260610;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const P = [];
  for (let i=0;i<70;i++) P.push({ x:rnd()*W, y:rnd()*H, s:.18 + rnd()*.34 });
  const noise = (x,y,t) => Math.sin(x*.0016+t) + Math.cos(y*.0021-t*.8) + Math.sin((x+y)*.0009+t*.5);
  let t = 0;
  (function tick(){
    t += .0016;
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(27,111,174,.13)";
    P.forEach(p => {
      const a = noise(p.x,p.y,t) * Math.PI;
      p.x += Math.cos(a)*p.s; p.y += Math.sin(a)*p.s;
      if (p.x < -20) p.x = W+20; if (p.x > W+20) p.x = -20;
      if (p.y < -20) p.y = H+20; if (p.y > H+20) p.y = -20;
      ctx.beginPath(); ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x - Math.cos(a)*7, p.y - Math.sin(a)*7); ctx.stroke();
    });
    requestAnimationFrame(tick);
  })();
}

/* ============================== INIT ================================ */
function gateMsg(html){ $("#gateMsg").innerHTML = html; }

async function start(){
  flowField();
  await msalApp.initialize();
  const rr = await msalApp.handleRedirectPromise().catch(e => { console.error(e); return null; });
  const acct = (rr && rr.account) || msalApp.getAllAccounts()[0];
  if (!acct){
    gateMsg("");
    $("#signIn").style.display = "";
    $("#signIn").onclick = () => framed
      ? msalApp.loginPopup({ scopes:CFG.scopes }).then(r => { S.acct = r.account; msalApp.setActiveAccount(r.account); boot(); })
      : msalApp.loginRedirect({ scopes:CFG.scopes });
    return;
  }
  S.acct = acct; msalApp.setActiveAccount(acct);
  boot();
}
async function boot(){
  try {
    gateMsg('<div class="spin"></div>Loading lists…');
    await resolveSite();
    if (!listId(CFG.listSheets)) throw new Error('List "' + CFG.listSheets + '" not found on ' + CFG.sitePath);
    await resolveColumns();
    await loadLookups();
    await loadSheets();
    $("#whoName").textContent = S.acct.name || S.acct.username || "";
    $("#gate").style.display = "none";
    $("#app").style.display = "";
    S.view = "list";
    renderAll();
    await handleDeepLink();
  } catch(e){
    console.error(e);
    const denied = e.status === 403 || e.status === 401;
    gateMsg('<span style="color:var(--bad)">' + (denied
      ? "Signed in, but you don't have access to the Production site. Ask Saul or Judah to add you."
      : esc(e.message || "Startup failed")) + "</span>");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  $("#signOut").onclick = () => msalApp.logoutRedirect({ postLogoutRedirectUri: redirectUri });
  $("#newBtn").onclick = () => openNewDialog(null);
  $("#newDesc").addEventListener("input", newCheck);
  $("#newUse").onclick = async () => {
    const id = $("#newUse").dataset.id, f = pendingImport; pendingImport = null;
    $("#newDlg").close(); await openSheet(id); if (f) await importComparison(f);
  };
  $("#seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    S.filter = b.dataset.f; S.folds = null;
    Array.from($("#seg").children).forEach(x => x.classList.toggle("on", x === b));
    renderAll();
  });
  $("#q").oninput = () => { S.q = $("#q").value; if (S.view === "list") renderAll(); };
  $("#newCancel").onclick = () => $("#newDlg").close();
  $("#newCreate").onclick = async () => {
    const desc = newCheck();
    if (!desc) return;
    $("#newDlg").close();
    await loadTracker();
    await createSheet(nextSheetName(), desc);
    if (pendingImport){ const f = pendingImport; pendingImport = null; await importComparison(f); }
  };
  $("#newDesc").addEventListener("keydown", e => { if (e.key === "Enter") $("#newCreate").click(); });
  $("#filePick").onchange = e => { if (e.target.files && e.target.files.length) uploadFiles(Array.from(e.target.files)); };
  $("#imgPick").onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (f && imgTarget) uploadImage(imgTarget, f);
  };
  $("#xlsPick").onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (S.view === "list") importFromHome(f);
    else importComparison(f);
  };
  $("#homeImp").onclick = () => { $("#xlsPick").value = ""; $("#xlsPick").click(); };
  window.addEventListener("beforeunload", e => { if (S.dirty){ e.preventDefault(); e.returnValue = ""; } });
  start();
});
