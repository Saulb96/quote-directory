<!DOCTYPE html>
<!--
================================================================================
M1S QUOTE DIRECTORY  —  saulb96.github.io/quote-directory/
Owner: Saul Braha, COO Metro1 Solutions. Single-file SPA, no build step.
================================================================================

WHAT IT IS
  Per-quote-sheet workspace. Header (sheet picker / follow-up date / attachments),
  a factory x step status matrix, and a style grid with per-factory MOQ + Price.
  No side panel — the quote sheet is chosen from the dropdown in the header.

STORAGE  (single list, JSON blob)
  List: Quote_Sheets  (named for the records it holds — one row per quote sheet.
        Deliberately NOT "Quote_Directory", which collides in conversation with
        the Quote Directory workbook sheet feeding the Quoting Report.)
    Title         Single line of text   quote sheet name / number
    FollowUpDate  Date and Time (Date Only)
    FactoriesCsv  Single line of text   derived, comma-joined, for search
    FurthestStep  Number (0 decimals)   derived, max completed step count
    SheetStatus   Choice                Active | Archived   (default Active)
    GridJson      Multiple lines, PLAIN TEXT, no versioning

  COLUMN NAME RESOLUTION — internal names are permanent and SharePoint appends a
  disambiguation digit when a same-named column existed before (Quote_Lookups
  ended up with LookupType0 this way). So the tool reads /lists/{id}/columns at
  boot and maps each canonical name to the real internal name: exact match, then
  case-insensitive, then trailing-digit-stripped. Read-only columns are skipped.
  If a column is missing entirely it is reported by name at startup.

  Sheet ordering is done in JS, not $orderby — FollowUpDate is unindexed and
  Graph rejects orderby on unindexed columns. If this list ever nears 5,000
  items, index FollowUpDate and SheetStatus and move to server-side paging.

  Concurrency: whole-blob PATCH guarded by If-Match on the item ETag. A 412
  raises a "changed elsewhere" banner instead of silently overwriting.
  A 400 triggers a field-by-field probe that names the rejecting column in the
  save indicator — otherwise Graph just says "Invalid request" and tells you
  nothing. Empty values are omitted rather than sent as null, which is itself a
  common cause of that 400.

LOOKUPS
  Steps      Quote_Lookups where LookupType0 = 'QuoteStep', ordered by SortOrder,
             Title = label. Falls back to STEP_FALLBACK. Rename or add a step by
             adding a row — no redeploy.
  Factories  Factories list. Name column is Title, else FactoryName / Factory /
             Supplier / Name. If the list cannot be read the picker degrades to
             a free-text box and the reason is shown inline.
  Sheet #s   Quote_Tracker (internal name "Qoute_Tracker" — the typo is real).
             The Quote Sheet column is found by display name prefix. Values not
             yet present in Quote_Sheets appear in the header dropdown under
             "In Quote Tracker"; picking one creates the sheet. Skipped silently
             if the list or column is not found.

ATTACHMENTS
  Document library ATTACH_LIBRARY, one folder per item id. <=4MB simple PUT,
  larger uses createUploadSession + chunked PUT.

PHOTOS
  One folder per Style # under PHOTO_CFG.library. Graph $batch, 20 keys per
  batch, 3 batches in flight — same shape as Quote Tracker.
  >>> CFG.photoLibrary is the one value to confirm. If it does not resolve the
  >>> grid shows placeholders; nothing breaks.

RULES ENCODED
  - Steps are sequential. Step N is clickable only when N-1 is done.
  - Anyone with access can tick AND un-tick. Un-tick is offered on the LAST
    completed step only, so a run never ends up with gaps.
  - Ticking sets FollowUpDate = tick date + 1 CALENDAR day. Manual edits allowed
    but the next tick overwrites them.
  - Removing a factory drops its ticks and its MOQ/Price columns outright.
  - Autosave, 800ms debounce. No save button, no confirm dialogs.

ENTRA
  App "Quote Directory" 70f97ec1-89f5-43cf-bb49-b28e794c1386, single tenant.
  Platform MUST be SPA, not Web — Web triggers CORS on GitHub Pages.
  Redirect URI = https://saulb96.github.io/quote-directory/
  Delegated: User.Read, Sites.ReadWrite.All. No app roles.
  Assignment required = NO. Delegated calls run as the signed-in user, so
  SharePoint permissions on /sites/Production are the real gate.

FAVICON
  Inline SVG data URI, house gradient + accent-bordered "Q". Swap the href if
  the suite adopts a shared mark.

FIRST-RUN CHECKS
  1. Tick a step, reload — follow-up must still read the NEXT CALENDAR DAY.
     That round-trip through the Date-Only column is where a timezone shift
     would surface.
  2. Add a factory mid-session — the status row and the style-grid column group
     must appear together. Both read the same factories array.
================================================================================
-->

<style>
:root{

dialog{border:1px solid var(--line);border-radius:var(--r);padding:0;max-width:440px;width:92vw;background:#fff;box-shadow:0 14px 44px rgba(22,32,44,.22);color:var(--ink)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#flow{display:none}}

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script>
"use strict";

/* ============================== CONFIG ============================== */
const CFG = {
  clientId : "70f97ec1-89f5-43cf-bb49-b28e794c1386",
  tenantId : "eeea7e3e-9ccb-4a16-894e-3417c6a7a4c1",
  host     : "met1sol.sharepoint.com",
  sitePath : "/sites/Production",
  scopes   : ["User.Read", "Sites.ReadWrite.All"],

  listSheets    : "Quote_Sheets",
  listLookups   : "Quote_Lookups",
  listFactories : "Factories",
  listTracker   : "Qoute_Tracker",           // internal-name typo is real
  trackerAlt    : "Quote_Tracker",           // display name

  attachLibrary : "Quote Sheet Files",
  photoLibrary  : "Style Photos"             // >>> CONFIRM
};
const STEP_FALLBACK = ["Factory Sent", "Confirmed", "Approved"];
const CANON = ["Title","FollowUpDate","FactoriesCsv","FurthestStep","SheetStatus","GridJson"];
const G = "https://graph.microsoft.com/v1.0";

/* ============================== STATE =============================== */
const S = {
  acct:null,
  siteId:null, lists:{}, cols:{}, missingCols:[], driveAttach:null, drivePhoto:null,
  steps:STEP_FALLBACK.slice(), factoryNames:[], facErr:"", trackerNames:[],
  sheets:[], cur:null, curEtag:null, dirty:false, saveTimer:null, conflict:false,
  filesLoaded:false, photos:new Map()
};

/* ============================== MSAL ================================ */
const redirectUri = window.location.origin + window.location.pathname;
const msalApp = new msal.PublicClientApplication({
  auth:{ clientId:CFG.clientId, authority:"https://login.microsoftonline.com/"+CFG.tenantId, redirectUri },
  cache:{ cacheLocation:"localStorage", storeAuthStateInCookie:false }
});
const framed = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();

async function getToken(){
  const r = await msalApp.acquireTokenSilent({ scopes:CFG.scopes, account:S.acct })
    .catch(async () => framed
      ? msalApp.acquireTokenPopup({ scopes:CFG.scopes })
      : (msalApp.acquireTokenRedirect({ scopes:CFG.scopes }), new Promise(()=>{})));
  return r.accessToken;
}

/* ============================== GRAPH =============================== */
async function gf(path, opts){
  opts = opts || {};
  const tok = await getToken();
  const h = Object.assign({ Authorization:"Bearer "+tok }, opts.headers || {});
  if (opts.body && !(opts.body instanceof ArrayBuffer) && !h["Content-Type"]) h["Content-Type"] = "application/json";
  const url = /^https?:/.test(path) ? path : G + path;
  const res = await fetch(url, { method:opts.method || "GET", headers:h, body:opts.body });
  if (res.status === 429 || res.status === 503){
    await new Promise(r => setTimeout(r, (parseInt(res.headers.get("Retry-After") || "3",10)) * 1000));
    return gf(path, opts);
  }
  if (!res.ok){
    const txt = await res.text().catch(()=> "");
    const err = new Error("Graph " + res.status + " — " + txt.slice(0,240));
    err.status = res.status; err.raw = txt;
    throw err;
  }
  if (res.status === 204 || res.status === 202) return null;
  const ct = res.headers.get("Content-Type") || "";
  return ct.indexOf("json") >= 0 ? res.json() : null;
}
async function gAll(path){
  const out = []; let next = path;
  while (next){
    const p = await gf(next);
    if (p && p.value) out.push.apply(out, p.value);
    next = p && p["@odata.nextLink"] ? p["@odata.nextLink"] : null;
  }
  return out;
}

/* ====================== SITE / LISTS / COLUMNS ====================== */
async function resolveSite(){
  const s = await gf("/sites/" + CFG.host + ":" + CFG.sitePath);
  S.siteId = s.id;
  const lists = await gAll("/sites/" + S.siteId + "/lists?$select=id,name,displayName&$top=300");
  lists.forEach(l => {
    S.lists[l.name] = l.id; S.lists[l.displayName] = l.id;
    S.lists[String(l.name).toLowerCase()] = l.id;
    S.lists[String(l.displayName).toLowerCase()] = l.id;
  });
  const drives = await gAll("/sites/" + S.siteId + "/drives?$select=id,name");
  const pick = n => { const d = drives.find(x => x.name === n); return d ? d.id : null; };
  S.driveAttach = pick(CFG.attachLibrary);
  S.drivePhoto  = pick(CFG.photoLibrary);
}
function listId(name){ return S.lists[name] || S.lists[String(name).toLowerCase()] || null; }

/* Map canonical column names to real internal names. Handles the disambiguation
   digit SharePoint appends (LookupType -> LookupType0) and casing drift. */
async function resolveColumns(){
  const id = listId(CFG.listSheets);
  const cols = await gAll("/sites/" + S.siteId + "/lists/" + id + "/columns?$select=name,displayName,readOnly&$top=300");
  const writable = cols.filter(c => !c.readOnly);
  const strip = s => String(s).replace(/\d+$/, "").toLowerCase();
  S.cols = {}; S.missingCols = [];
  CANON.forEach(canon => {
    let hit = writable.find(c => c.name === canon)
           || writable.find(c => String(c.name).toLowerCase() === canon.toLowerCase())
           || writable.find(c => strip(c.name) === canon.toLowerCase())
           || writable.find(c => String(c.displayName).toLowerCase() === canon.toLowerCase());
    if (hit) S.cols[canon] = hit.name; else S.missingCols.push(canon);
  });
}
const C = k => S.cols[k] || k;
function selectClause(){ return CANON.filter(k => S.cols[k]).map(k => S.cols[k]).join(","); }
function readF(f, k){ return f[C(k)]; }

/* ============================== LOOKUPS ============================= */
async function loadLookups(){
  // Steps
  try {
    const id = listId(CFG.listLookups);
    if (!id) throw new Error('list "' + CFG.listLookups + '" not found');
    const rows = await gAll("/sites/" + S.siteId + "/lists/" + id +
      "/items?expand=fields(select=Title,LookupType0,SortOrder)&$top=500");
    const steps = rows.map(r => r.fields || {})
      .filter(f => String(f.LookupType0 || "") === "QuoteStep")
      .sort((a,b) => (Number(a.SortOrder)||0) - (Number(b.SortOrder)||0))
      .map(f => String(f.Title || "").trim()).filter(Boolean);
    if (steps.length) S.steps = steps;
  } catch(e){ console.warn("Step lookup failed, using fallback:", e.message); }

  // Factories — report precisely why it fails rather than swallowing it
  S.factoryNames = []; S.facErr = "";
  try {
    const id = listId(CFG.listFactories);
    if (!id){ S.facErr = 'No list named "' + CFG.listFactories + '" on ' + CFG.sitePath + '.'; }
    else {
      const cols = await gAll("/sites/" + S.siteId + "/lists/" + id + "/columns?$select=name,displayName&$top=200");
      const want = ["Title","FactoryName","Factory","Supplier","Name"];
      const nameCol = want.map(w => cols.find(c => c.name === w || String(c.displayName).toLowerCase() === w.toLowerCase()))
                          .find(Boolean);
      if (!nameCol){ S.facErr = 'Found the Factories list but no Title / FactoryName / Factory / Supplier / Name column.'; }
      else {
        const rows = await gAll("/sites/" + S.siteId + "/lists/" + id +
          "/items?expand=fields(select=" + nameCol.name + ")&$top=1000");
        S.factoryNames = rows.map(r => String((r.fields||{})[nameCol.name] || "").trim())
          .filter(Boolean).filter((v,i,a) => a.indexOf(v) === i).sort((a,b) => a.localeCompare(b));
        if (!S.factoryNames.length) S.facErr = 'Factories list read OK but "' + nameCol.name + '" is empty on every row.';
      }
    }
  } catch(e){ S.facErr = "Factories list error — " + (e.message || ""); }
}

async function loadTrackerNames(){

async function loadSheets(){

/* ============================== UTIL ================================ */
const $  = s => document.querySelector(s);
const el = (t,c,x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = () => Math.random().toString(36).slice(2,9);
function dayKey(d){ const p = n => String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function nextCalendarDay(from){ return dayKey(new Date(from.getFullYear(), from.getMonth(), from.getDate()+1)); }
function fmtStamp(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  let h = d.getHours(); const ap = h >= 12 ? "p" : "a"; h = h % 12 || 12;
  return (d.getMonth()+1)+"/"+d.getDate()+"/"+String(d.getFullYear()).slice(2)+" "+h+":"+String(d.getMinutes()).padStart(2,"0")+ap;
}
function fmtSize(b){ if (b == null) return ""; if (b < 1024) return b+" B"; if (b < 1048576) return (b/1024).toFixed(0)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
function blankGrid(){ return { v:1, steps:S.steps.slice(), factories:[], styles:[] }; }
function normalize(g){
  g = g && typeof g === "object" ? g : {};
  g.v = 1;
  g.steps = Array.isArray(g.steps) && g.steps.length ? g.steps : S.steps.slice();
  g.factories = Array.isArray(g.factories) ? g.factories : [];
  g.styles = Array.isArray(g.styles) ? g.styles : [];
  const n = g.steps.length;
  g.factories.forEach(f => {
    f.id = f.id || uid(); f.name = f.name || ""; f.notes = f.notes || "";
    f.steps = Array.isArray(f.steps) ? f.steps : [];
    while (f.steps.length < n) f.steps.push(null);
    f.steps.length = n;
  });
  g.styles.forEach(s => {
    s.id = s.id || uid(); s.style = s.style || ""; s.desc = s.desc || "";
    s.cells = s.cells && typeof s.cells === "object" ? s.cells : {};
    g.factories.forEach(f => { if (!s.cells[f.id]) s.cells[f.id] = { moq:"", price:"" }; });
  });
  return g;
}
function furthest(g){
  let m = 0;
  g.factories.forEach(f => { let c = 0; for (let i=0;i<f.steps.length;i++){ if (f.steps[i]) c++; else break; } if (c>m) m=c; });
  return m;
}

/* ============================== SAVE ================================ */
function setSaveState(kind, msg){
  const n = $("#saveState");
  n.className = "save" + (kind === "err" ? " err" : "");
  n.innerHTML = "";
  if (kind === "saving"){ n.appendChild(el("div","spin")); n.appendChild(el("span",null,"Saving…")); }
  else if (kind === "saved") n.appendChild(el("span",null,"Saved " + fmtStamp(new Date().toISOString())));
  else if (kind === "err") n.appendChild(el("span",null, msg || "Save failed"));
}
function touch(){
  if (!S.cur || S.conflict) return;
  S.dirty = true;
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(save, 800);
}
function buildFields(c){
  const f = {};
  const put = (k,v) => { if (S.cols[k] && v !== null && v !== undefined && v !== "") f[S.cols[k]] = v; };
  put("Title", c.name || "(untitled)");
  put("FollowUpDate", c.follow ? c.follow + "T00:00:00Z" : "");   // omitted when blank — null here is a common 400
  put("FactoriesCsv", c.grid.factories.map(x => x.name).filter(Boolean).join(", "));
  if (S.cols.FurthestStep) f[S.cols.FurthestStep] = furthest(c.grid);
  put("SheetStatus", c.status || "Active");
  put("GridJson", JSON.stringify(c.grid));
  return f;
}
async function save(){
  if (!S.cur || !S.dirty || S.conflict) return;
  const c = S.cur, fields = buildFields(c);
  const url = "/sites/" + S.siteId + "/lists/" + listId(CFG.listSheets) + "/items/" + c.id + "/fields";
  setSaveState("saving");
  try {
    const r = await gf(url, { method:"PATCH", headers:{ "If-Match": S.curEtag || "*" }, body:JSON.stringify(fields) });
    S.dirty = false; setSaveState("saved");
    if (r && r["@odata.etag"]) S.curEtag = r["@odata.etag"]; else await refreshEtag();
    const row = S.sheets.find(s => s.id === c.id);
    if (row){ row.name = c.name; row.follow = c.follow; row.status = c.status; }
  } catch(e){
    if (e.status === 412){ S.conflict = true; setSaveState("err","Changed elsewhere"); renderDetail(); return; }
    if (e.status === 400){
      setSaveState("err","Save failed — finding the column…");
      const bad = await probeFields(url, fields);
      setSaveState("err", bad.length
        ? "Save failed — column rejected: " + bad.join(", ")
        : "Save failed — Graph 400, no single column reproduced it");
      console.error("400 on save. Payload:", fields, e.raw);
      return;
    }
    setSaveState("err","Save failed — " + (e.message || "")); console.error(e);
  }
}
/* Graph answers a bad field with a bare "Invalid request". Re-send one field at a
   time so the offending column is named in the UI instead of guessed at. */
async function probeFields(url, fields){
  const bad = [];
  for (const k of Object.keys(fields)){
    const one = {}; one[k] = fields[k];
    try { await gf(url, { method:"PATCH", body:JSON.stringify(one) }); }
    catch(e){ if (e.status === 400) bad.push(k); }
  }
  return bad;
}
async function refreshEtag(){
  try {
    const it = await gf("/sites/" + S.siteId + "/lists/" + listId(CFG.listSheets) + "/items/" + S.cur.id + "?$select=id,eTag");
    S.curEtag = (it && (it.eTag || it["@odata.etag"])) || null;
  } catch(e){ S.curEtag = null; }
}

/* ============================== OPEN ================================ */
async function openSheet(id){
  if (S.dirty) await save();
  S.conflict = false; S.photos.clear(); S.filesLoaded = false;
  const d = $("#detail");
  d.innerHTML = "";
  const c = el("div","card"); c.innerHTML = '<div class="inline-load"><div class="spin"></div>Opening quote sheet…</div>';
  d.appendChild(c);

  const it = await gf("/sites/" + S.siteId + "/lists/" + listId(CFG.listSheets) + "/items/" + id +
    "?expand=fields(select=" + selectClause() + ")");
  const f = it.fields || {};
  let grid;
  try { grid = JSON.parse(readF(f,"GridJson") || "null") || blankGrid(); }
  catch(e){ grid = blankGrid(); console.warn("GridJson unparseable on item " + id + " — starting fresh"); }

  const fu = readF(f,"FollowUpDate");
  S.cur = {
    id:id,
    name:readF(f,"Title") || "",
    follow:fu ? String(fu).slice(0,10) : "",
    status:readF(f,"SheetStatus") || "Active",
    grid:normalize(grid),
    files:[]
  };
  S.curEtag = it.eTag || it["@odata.etag"] || null;
  setSaveState("");
  renderDetail();
  loadFiles();
  loadPhotos();
}

  if (S.conflict){
    const b = el("div","banner bad");
    b.appendChild(el("span",null,"Someone else saved this sheet after you opened it. Reload to take their version — your unsaved edits here will be dropped."));

/* ---------- status matrix ---------- */
function statusCard(){
  const g = S.cur.grid;
  const card = el("div","card");
  const hd = el("div","card-hd");
  hd.appendChild(el("h2",null,"Factory status"));
  hd.appendChild(el("div","spacer"));
  hd.appendChild(el("span","hint","Sequential · ticking sets follow-up to the next day · hover a stamp to undo the latest step"));
  card.appendChild(hd);

  const bd = el("div","card-bd flush");
  if (!g.factories.length){
    bd.appendChild(el("div","empty","No factories on this sheet yet."));
  } else {
    const sc = el("div","tbl-scroll");
    const t = document.createElement("table");
    const th = document.createElement("thead");
    const hr = document.createElement("tr");
    hr.appendChild(el("th",null,"Factory"));
    g.steps.forEach(s => hr.appendChild(el("th","step-c",s)));
    hr.appendChild(el("th","w-notes","Notes"));
    hr.appendChild(el("th"));
    th.appendChild(hr); t.appendChild(th);

    const tb = document.createElement("tbody");
    g.factories.forEach(f => {
      const tr = document.createElement("tr");
      tr.appendChild(el("td","fac-nm",f.name));
      f.steps.forEach((st, i) => {
        const td = el("td","step-c");
        if (st){
          const dn = el("div","done");
          if (isLastDone(f,i)) dn.classList.add("unlockable");
          dn.appendChild(el("span",null,fmtStamp(st.at)));
          dn.appendChild(el("span","by",st.by || ""));
          if (isLastDone(f,i)){
            const u = el("button","undo","✕");
            u.title = "Undo this tick";
            u.onclick = ev => { ev.stopPropagation(); f.steps[i] = null; touch(); renderDetail(); };
            dn.appendChild(u);
          }
          td.appendChild(dn);
        } else {
          const b = el("button","tick");
          const open = i === 0 || !!f.steps[i-1];
          b.disabled = !open;
          b.title = open ? "Mark " + g.steps[i] : "Complete " + g.steps[i-1] + " first";
          b.onclick = () => tickStep(f, i);
          td.appendChild(b);
        }
        tr.appendChild(td);
      });
      const nt = el("td","w-notes");
      const ta = document.createElement("textarea");
      ta.rows = 1; ta.value = f.notes || "";
      ta.oninput = () => { f.notes = ta.value; touch(); };
      nt.appendChild(ta); tr.appendChild(nt);

      const xd = el("td");
      const x = el("button","icon row-x","✕");
      x.title = f.steps.some(Boolean) ? "Remove factory — drops its ticks and its MOQ/Price columns" : "Remove factory";
      x.onclick = () => removeFactory(f.id);
      xd.appendChild(x); tr.appendChild(xd);
      tb.appendChild(tr);
    });
    t.appendChild(tb); sc.appendChild(t); bd.appendChild(sc);
  }

  const bar = el("div","add-bar");
  const used = new Set(g.factories.map(f => f.name));
  if (S.factoryNames.length){
    const sel = document.createElement("select");
    sel.style.maxWidth = "260px";
    sel.appendChild(new Option("Add factory…",""));
    S.factoryNames.filter(n => !used.has(n)).forEach(n => sel.appendChild(new Option(n,n)));
    sel.onchange = () => { if (sel.value){ addFactory(sel.value); sel.value = ""; } };
    bar.appendChild(sel);
  } else {
    const inp = document.createElement("input");
    inp.placeholder = "Factory name…"; inp.style.maxWidth = "260px";
    inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()){ addFactory(inp.value.trim()); inp.value = ""; } };
    bar.appendChild(inp);
    bar.appendChild(el("span","hint warn", (S.facErr || "Factories list unavailable.") + " Typing a name works meanwhile."));
  }
  bd.appendChild(bar);
  card.appendChild(bd);
  return card;
}
function isLastDone(f,i){
  if (!f.steps[i]) return false;
  for (let j=i+1;j<f.steps.length;j++) if (f.steps[j]) return false;
  return true;
}
function tickStep(f,i){
  if (f.steps[i]) return;
  if (i > 0 && !f.steps[i-1]) return;
  const now = new Date();
  f.steps[i] = { at:now.toISOString(), by:(S.acct && S.acct.name) || "" };
  S.cur.follow = nextCalendarDay(now);
  touch(); renderDetail();
}
function addFactory(name){
  const g = S.cur.grid;
  if (g.factories.some(f => f.name === name)) return;
  const f = { id:uid(), name:name, notes:"", steps:g.steps.map(() => null) };
  g.factories.push(f);
  g.styles.forEach(s => { s.cells[f.id] = { moq:"", price:"" }; });
  touch(); renderDetail();
}
function removeFactory(id){
  const g = S.cur.grid;
  g.factories = g.factories.filter(f => f.id !== id);
  g.styles.forEach(s => { delete s.cells[id]; });
  touch(); renderDetail();
}

/* ---------- photos ---------- */
function photoNode(style){
  const key = String(style || "").trim();
  const n = el("div","ph");
  if (!key){ n.appendChild(el("span","none","—")); return n; }
  const hit = S.photos.get(key);
  if (hit === undefined){ n.classList.add("load"); return n; }
  if (hit === null){ n.appendChild(el("span","none","no photo")); return n; }
  const img = document.createElement("img");
  img.src = hit; img.alt = key; img.loading = "lazy";
  n.appendChild(img);
  return n;
}
async function loadPhotos(){
  if (!S.cur) return;
  if (!S.drivePhoto){
    S.cur.grid.styles.forEach(s => { const k = String(s.style||"").trim(); if (k && !S.photos.has(k)) S.photos.set(k, null); });
    renderDetail(); return;
  }
  const keys = [], seen = new Set();
  S.cur.grid.styles.forEach(s => {
    const k = String(s.style || "").trim();
    if (k && !seen.has(k) && !S.photos.has(k)){ seen.add(k); keys.push(k); }
  });
  if (!keys.length) return;
  const batches = [];
  for (let i=0;i<keys.length;i+=20) batches.push(keys.slice(i,i+20));
  let idx = 0;
  const worker = async () => {
    while (idx < batches.length){
      const b = batches[idx++];
      const requests = b.map((k,i) => ({
        id:String(i), method:"GET",
        url:"/drives/" + S.drivePhoto + "/root:/" + encodeURIComponent(k) +
            ":/children?$select=name,file,@microsoft.graph.downloadUrl&$top=20"
      }));
      try {
        const res = await gf("/$batch", { method:"POST", body:JSON.stringify({ requests:requests }) });
        (res.responses || []).forEach(r => {
          const key = b[Number(r.id)];
          let url = null;
          if (r.status === 200 && r.body && r.body.value){
            const img = r.body.value.find(x => x.file && /\.(jpe?g|png|gif|webp|bmp)$/i.test(x.name || ""));
            if (img) url = img["@microsoft.graph.downloadUrl"] || null;
          }
          S.photos.set(key, url);
        });
      } catch(e){ b.forEach(k => S.photos.set(k, null)); console.warn("Photo batch failed", e.message); }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if (S.cur) renderDetail();
}

/* ---------- attachments ---------- */
function folderPath(){ return "/" + S.cur.id; }
async function loadFiles(){
  if (!S.cur) return;
  if (S.driveAttach){
    try {
      const r = await gf("/drives/" + S.driveAttach + "/root:" + folderPath() + ":/children?$select=name,size,webUrl&$top=200");
      S.cur.files = (r && r.value) || [];
    } catch(e){ S.cur.files = []; }
  }
  S.filesLoaded = true;
  renderFiles();
}
function renderFiles(){
  const box = $("#fileList");
  if (!box || !S.cur) return;
  box.innerHTML = "";
  if (!S.driveAttach){ box.appendChild(el("span","hint warn",'Library "' + CFG.attachLibrary + '" not found on ' + CFG.sitePath + '.')); return; }
  if (!S.filesLoaded){ box.appendChild(el("span","hint","Loading files…")); return; }
  if (!S.cur.files.length){ box.appendChild(el("span","hint","No files attached.")); return; }
  S.cur.files.forEach(f => {
    const n = el("div","file");
    const a = document.createElement("a");
    a.href = f.webUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = f.name;
    n.appendChild(a);
    n.appendChild(el("span","sz",fmtSize(f.size)));
    const x = el("button","icon","✕");
    x.title = "Delete file";
    x.onclick = async () => {
      x.disabled = true;
      try {
        await gf("/drives/" + S.driveAttach + "/root:" + folderPath() + "/" + encodeURIComponent(f.name) + ":", { method:"DELETE" });
        S.cur.files = S.cur.files.filter(z => z.name !== f.name);
        renderFiles();
      } catch(e){ x.disabled = false; }
    };
    n.appendChild(x); box.appendChild(n);
  });
}
async function ensureFolder(){
  try { await gf("/drives/" + S.driveAttach + "/root:" + folderPath()); return; }
  catch(e){ if (e.status !== 404) throw e; }
  await gf("/drives/" + S.driveAttach + "/root/children", {
    method:"POST",
    body:JSON.stringify({ name:String(S.cur.id), folder:{}, "@microsoft.graph.conflictBehavior":"replace" })
  });
}
async function uploadFiles(list){
  if (!S.cur || !S.driveAttach) return;
  S.filesLoaded = false;
  const box = $("#fileList");
  if (box){ box.innerHTML = ""; box.appendChild(el("span","hint","Uploading…")); }
  try {
    await ensureFolder();
    for (const file of list){
      const dest = "/drives/" + S.driveAttach + "/root:" + folderPath() + "/" + encodeURIComponent(file.name);
      if (file.size <= 4*1024*1024){
        const buf = await file.arrayBuffer();
        await gf(dest + ":/content", { method:"PUT", headers:{ "Content-Type":"application/octet-stream" }, body:buf });
      } else {
        const sess = await gf(dest + ":/createUploadSession", {
          method:"POST", body:JSON.stringify({ item:{ "@microsoft.graph.conflictBehavior":"replace" } })
        });
        const CH = 327680 * 10; // 3.2 MB, multiple of 320 KiB as Graph requires
        for (let start = 0; start < file.size; start += CH){
          const end = Math.min(start + CH, file.size);
          const chunk = await file.slice(start, end).arrayBuffer();
          const tok = await getToken();
          const r = await fetch(sess.uploadUrl, {
            method:"PUT",
            headers:{ Authorization:"Bearer "+tok, "Content-Range":"bytes "+start+"-"+(end-1)+"/"+file.size },
            body:chunk
          });
          if (!r.ok && r.status !== 202) throw new Error("Chunk upload failed " + r.status);
        }
      }
    }
  } catch(e){ console.error(e); }
  await loadFiles();
}

/* ---------- create ---------- */
async function createSheet(name){
  const fields = {};
  const put = (k,v) => { if (S.cols[k]) fields[S.cols[k]] = v; };
  put("Title", name);
  put("SheetStatus", "Active");
  put("FollowUpDate", dayKey(new Date()) + "T00:00:00Z");
  put("GridJson", JSON.stringify(blankGrid()));
  if (S.cols.FurthestStep) fields[S.cols.FurthestStep] = 0;
  const it = await gf("/sites/" + S.siteId + "/lists/" + listId(CFG.listSheets) + "/items",
    { method:"POST", body:JSON.stringify({ fields:fields }) });
  await loadSheets();
  openSheet(it.id);
}

/* ============================== CANVAS ============================== */
function flowField(){
  const cv = $("#flow"), ctx = cv.getContext("2d");
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W,H;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); addEventListener("resize", resize);
  let seed = 20260610;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const P = [];
  for (let i=0;i<70;i++) P.push({ x:rnd()*W, y:rnd()*H, s:.18 + rnd()*.34 });
  const noise = (x,y,t) => Math.sin(x*.0016+t) + Math.cos(y*.0021-t*.8) + Math.sin((x+y)*.0009+t*.5);
  let t = 0;
  (function tick(){
    t += .0016;
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(53,116,212,.13)";
    P.forEach(p => {
      const a = noise(p.x,p.y,t) * Math.PI;
      p.x += Math.cos(a)*p.s; p.y += Math.sin(a)*p.s;
      if (p.x < -20) p.x = W+20; if (p.x > W+20) p.x = -20;
      if (p.y < -20) p.y = H+20; if (p.y > H+20) p.y = -20;
      ctx.beginPath(); ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x - Math.cos(a)*7, p.y - Math.sin(a)*7); ctx.stroke();
    });
    requestAnimationFrame(tick);
  })();
}

/* ============================== INIT ================================ */
function gateMsg(html){ $("#gateMsg").innerHTML = html; }

async function start(){
  flowField();
  await msalApp.initialize();
  const rr = await msalApp.handleRedirectPromise().catch(e => { console.error(e); return null; });
  const acct = (rr && rr.account) || msalApp.getAllAccounts()[0];
  if (!acct){
    gateMsg("");
    $("#signIn").style.display = "";
    $("#signIn").onclick = () => framed
      ? msalApp.loginPopup({ scopes:CFG.scopes }).then(r => { S.acct = r.account; msalApp.setActiveAccount(r.account); boot(); })
      : msalApp.loginRedirect({ scopes:CFG.scopes });
    return;
  }
  S.acct = acct; msalApp.setActiveAccount(acct);
  boot();
}
async function boot(){
  try {
    gateMsg('<div class="spin"></div>Loading lists…');
    await resolveSite();
    if (!listId(CFG.listSheets)) throw new Error('List "' + CFG.listSheets + '" not found on ' + CFG.sitePath);
    await resolveColumns();
    await loadLookups();
    await loadSheets();
    $("#whoName").textContent = S.acct.name || S.acct.username || "";
    $("#gate").style.display = "none";
    $("#app").style.display = "";
    renderDetail();
    loadTrackerNames();
  } catch(e){
    console.error(e);
    const denied = e.status === 403 || e.status === 401;
    gateMsg('<span style="color:var(--bad)">' + (denied
      ? "Signed in, but you don't have access to the Production site. Ask Saul or Judah to add you."
      : esc(e.message || "Startup failed")) + "</span>");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  $("#signOut").onclick = () => msalApp.logoutRedirect({ postLogoutRedirectUri: redirectUri });
  $("#newCancel").onclick = () => $("#newDlg").close();
  $("#newCreate").onclick = async () => {
    const n = ($("#newName").value || "").trim();
    if (!n) return;
    $("#newDlg").close();
    await createSheet(n);
  };
  $("#newName").addEventListener("keydown", e => { if (e.key === "Enter") $("#newCreate").click(); });
  $("#filePick").onchange = e => { if (e.target.files && e.target.files.length) uploadFiles(Array.from(e.target.files)); };
  window.addEventListener("beforeunload", e => { if (S.dirty){ e.preventDefault(); e.returnValue = ""; } });
  start();
});
